    const formatIDR = (val) => {
      if (val === undefined || val === null || isNaN(val)) return 'Rp0';
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(val);
    };

    const parseDateToNumber = (dateStr) => {
      if (!dateStr) return 0;
      if (dateStr.includes('-')) {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          return parseInt(`${parts[0]}${parts[1].padStart(2, '0')}${parts[2].padStart(2, '0')}`, 10);
        }
      } else if (dateStr.includes('/')) {
        const parts = dateStr.split('/');
        if (parts.length === 3) {
          return parseInt(`${parts[2]}${parts[1].padStart(2, '0')}${parts[0].padStart(2, '0')}`, 10);
        }
      }
      return 0;
    };

    const sortTransactionsChronologically = (trxList) => {
      return [...trxList].sort((a, b) => {
        const numA = parseDateToNumber(a.date);
        const numB = parseDateToNumber(b.date);
        if (numA !== numB) return numA - numB;
        if (a.type === 'Pendapatan' && b.type !== 'Pendapatan') return -1;
        if (a.type !== 'Pendapatan' && b.type === 'Pendapatan') return 1;
        return 0;
      });
    };

          } else if (t.date.includes('/')) {

      const handleFileUpload = (e) => {
        if (!userPermissions.canImport) {
          showToast('⚠️ Akses Ditolak! Anda tidak memiliki izin untuk mengimport data.');
          return;
        }
        const file = e.target.files?.[0];
        if (!file) return;

        const { db, ref, set, push, update } = window.FirebaseDB;
        setIsUploading(true);
        setUploadStep(1);
        setUploadStatusText('Membaca dan memindai file CSV...');
        setUploadProgressPct(15);

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const text = evt.target?.result;
            if (!text) {
              showToast('⚠️ File kosong atau tidak dapat dibaca!');
              setIsUploading(false);
              return;
            }

            setUploadStep(2);
            setUploadStatusText('Menguraikan baris transaksi & teks...');
            setUploadProgressPct(35);

            const rows = [];
            let currentRow = [];
            let currentEntry = '';
            let insideQuote = false;

            for (let i = 0; i < text.length; i++) {
              const char = text[i];
              const nextChar = text[i + 1];

              if (char === '"') {
                if (insideQuote && nextChar === '"') {
                  currentEntry += '"';
                  i++;
                } else {
                  insideQuote = !insideQuote;
                }
              } else if ((char === ',' || char === ';') && !insideQuote) {
                currentRow.push(currentEntry.trim().replace(/^["']|["']$/g, ''));
                currentEntry = '';
              } else if ((char === '\r' || char === '\n') && !insideQuote) {
                if (char === '\r' && nextChar === '\n') { i++; }
                currentRow.push(currentEntry.trim().replace(/^["']|["']$/g, ''));
                if (currentRow.length > 1 || currentRow[0] !== '') {
                  rows.push(currentRow);
                }
                currentRow = [];
                currentEntry = '';
              } else {
                currentEntry += char;
              }
            }
            if (currentEntry !== '' || currentRow.length > 0) {
              currentRow.push(currentEntry.trim().replace(/^["']|["']$/g, ''));
              rows.push(currentRow);
            }

            if (rows.length < 2) {
              showToast('⚠️ Format baris file CSV tidak valid!');
              setIsUploading(false);
              return;
            }

            setUploadStep(3);
            setUploadStatusText('Memvalidasi nominal & mengelompokkan kegiatan...');
            setUploadProgressPct(65);

            let importedCount = 0;
            let totalRevenue = 0;
            let totalExpenditure = 0;
            
            const updates = {};
            const transactionsRef = ref(db, 'transactions');

            for (let i = 1; i < rows.length; i++) {
              const row = rows[i];
              if (!row || row.length < 5) continue;

              const dateVal = row[0] || new Date().toISOString().split('T')[0];
              const categoryVal = row[1] || 'Pendapatan Asli Desa (PAD)';
              const activityVal = row[2] || 'Umum';
              const ketVal = row[3] || 'Transaksi Import';

              const lastColVal = String(row[row.length - 1] || row[5] || '').trim().toUpperCase();
              
              let isIncome = true;
              if (lastColVal === 'OUT' || lastColVal.includes('KELUAR') || lastColVal.includes('KLR')) {
                isIncome = false;
              } else if (lastColVal === 'IN' || lastColVal.includes('MASUK') || lastColVal.includes('MSK')) {
                isIncome = true;
              } else {
                isIncome = !lastColVal.includes('OUT');
              }

              let amount = 0;
              const rawAmountStr = String(row[4] || row[3] || '').replace(/[^0-9]/g, '');
              amount = Number(rawAmountStr) || 0;

              if (amount <= 0) continue;

              const newTrxRef = push(transactionsRef);
              const newTrxId = `TRX-IMP-${Date.now().toString().slice(-4)}-${i}`;

              const formattedTrx = {
                id: newTrxId,
                date: dateVal,
                type: isIncome ? 'Pendapatan' : 'Pengeluaran',
                category: categoryVal,
                activity: activityVal,
                description: ketVal,
                accountId: '101',
                accountName: 'Kas Bendahara Desa',
                amount: amount,
                tax: 0,
                netAmount: amount,
                recipient: isIncome ? 'Kas Desa' : 'Pihak Terkait',
                status: 'Disetujui',
                approvedBy: currentUser ? currentUser.name : 'Sistem',
                approvedAt: new Date().toISOString().split('T')[0]
              };

              updates[`transactions/${newTrxRef.key}`] = formattedTrx;

              if (isIncome) totalRevenue += amount;
              else totalExpenditure += amount;

              importedCount++;
            }

            if (importedCount === 0) {
              showToast('⚠️ Tidak ada baris valid yang terbaca.');
              setIsUploading(false);
              return;
            }

            setUploadStep(4);
            setUploadStatusText('Menyimpan data massal ke Firebase Cloud Database...');
            setUploadProgressPct(85);

            await update(ref(db), updates);

            const updatedAccs = accounts.map(acc => {
              if (acc.id === '101') {
                const netChange = totalRevenue - totalExpenditure;
                return { ...acc, balance: (acc.balance || 0) + netChange };
              }
              return acc;
            });
            await set(ref(db, 'accounts'), updatedAccs);

            const auditRef = push(ref(db, 'auditLogs'));
            await set(auditRef, {
              timestamp: new Date().toLocaleString('id-ID'),
              user: currentUser ? currentUser.name : 'User',
              action: `Berhasil mengimport ${importedCount} data transaksi ke Cloud`,
              module: 'Import Data'
            });

            setUploadStep(5);
            setUploadStatusText('Selesai! Data berhasil disinkronkan.');
            setUploadProgressPct(100);

            setTimeout(() => {
              setIsUploading(false);
              showToast(`🎉 Sukses mengimport ${importedCount} data transaksi ke Cloud!`);
            }, 1200);

          } catch (err) {
            console.error('Error saat import:', err);
            setIsUploading(false);
            showToast('❌ Gagal mengimport data ke cloud.');
          }
        };

        reader.readAsText(file);
        e.target.value = '';
      };

                          const data = monthlyChartData;
                          
                          const maxVal = Math.max(...data.map(d => Math.max(d.revenue, d.expense)), 140000000);
                          const chartHeight = 220;
                          const chartWidth = 700;
                          const stepX = chartWidth / (months.length - 1);

                          const pointsRev = data.map((d, i) => ({
                            x: i * stepX,
                            y: chartHeight - (d.revenue / maxVal) * chartHeight
                          }));

                          const pointsExp = data.map((d, i) => ({
                            x: i * stepX,
                            y: chartHeight - (d.expense / maxVal) * chartHeight
                          }));

                          const makeSmoothPath = (pts) => {
                            if (pts.length === 0) return '';
                            let path = `M ${pts[0].x} ${pts[0].y}`;
                            for (let i = 0; i < pts.length - 1; i++) {
                              const xc = (pts[i].x + pts[i + 1].x) / 2;
                              const yc = (pts[i].y + pts[i + 1].y) / 2;
                              path += ` Q ${pts[i].x} ${pts[i].y}, ${xc} ${yc}`;
                            }
                            path += ` T ${pts[pts.length - 1].x} ${pts[pts.length - 1].y}`;
                            return path;
                          };

                          const pathRev = makeSmoothPath(pointsRev);
                          const pathExp = makeSmoothPath(pointsExp);

                          const pathRevArea = `${pathRev} L ${chartWidth} ${chartHeight} L 0 ${chartHeight} Z`;
                          const pathExpArea = `${pathExp} L ${chartWidth} ${chartHeight} L 0 ${chartHeight} Z`;

                          const yTicks = [0, 20000000, 40000000, 60000000, 80000000, 100000000, 120000000, 140000000];

                          return (
                            <svg viewBox={`0 0 ${chartWidth + 50} ${chartHeight + 40}`} className="w-full h-full overflow-visible">
                              <defs>
                                <linearGradient id="gradRev" x1="0%" y1="0%" x2="0%" y2="100%">
                                  <stop offset="0%" stopColor="#10b981" stopOpacity="0.5" />
                                  <stop offset="100%" stopColor="#10b981" stopOpacity="0.0" />
                                </linearGradient>
                                <linearGradient id="gradExp" x1="0%" y1="0%" x2="0%" y2="100%">
                                  <stop offset="0%" stopColor="#f43f5e" stopOpacity="0.5" />
                                  <stop offset="100%" stopColor="#f43f5e" stopOpacity="0.0" />
                                </linearGradient>
                              </defs>

                              {yTicks.map((val, idx) => {
                                const y = chartHeight - (val / maxVal) * chartHeight;
                                return (
                                  <g key={idx}>
                                    <line x1="0" y1={y} x2={chartWidth} y2={y} stroke="rgba(255,255,255,0.1)" strokeDasharray="4 4" strokeWidth="1" />
                                    <text x={chartWidth + 10} y={y + 4} fill="#94a3b8" fontSize="10" fontWeight="600">
                                      {val === 0 ? '0' : `${(val / 1000000).toLocaleString('id-ID')}.000.000`}
                                    </text>
                                  </g>
                                );
                              })}

                              <path d={pathRevArea} fill="url(#gradRev)" />
                              <path d={pathExpArea} fill="url(#gradExp)" />

                              <path d={pathRev} fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round" />
                              <path d={pathExp} fill="none" stroke="#f43f5e" strokeWidth="3" strokeLinecap="round" />

                              {pointsRev.map((pt, i) => (
                                <g key={`rev-pt-${i}`} className="cursor-pointer group">
                                  <circle cx={pt.x} cy={pt.y} r="4.5" fill="#02050e" stroke="#10b981" strokeWidth="2.5" />
                                  <circle cx={pt.x} cy={pt.y} r="2" fill="#10b981" />
                                </g>
                              ))}

                              {pointsExp.map((pt, i) => (
                                <g key={`exp-pt-${i}`} className="cursor-pointer group">
                                  <circle cx={pt.x} cy={pt.y} r="4.5" fill="#02050e" stroke="#f43f5e" strokeWidth="2.5" />
                                  <circle cx={pt.x} cy={pt.y} r="2" fill="#f43f5e" />
                                </g>
                              ))}

                              {months.map((m, i) => {
                                const x = i * stepX;
                                return (
                                  <text key={i} x={x} y={chartHeight + 25} fill="#94a3b8" fontSize="11" fontWeight="bold" textAnchor="middle">
                                    {m}
                                  </text>
                                );
                              })}
                            </svg>
                          );
                        })()}
                      </div>
                    </div>
                  </div>

                  {/* BREAKDOWNS */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-white/[0.025] backdrop-blur-[40px] rounded-2xl p-6 border border-white/15 shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] space-y-4">

                                    <td className="p-2.5 border border-slate-300 text-right font-bold text-emerald-700">{formatIDR(a.totalIn)}</td>
                                    <td className="p-2.5 border border-slate-300 text-right font-bold text-rose-700">{formatIDR(a.totalOut)}</td>
                                    <td className="p-2.5 border border-slate-300 text-right font-black text-slate-900">{formatIDR(a.net)}</td>
                                  </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>

                        <div className="space-y-3">
                          <h5 className="text-xs font-black uppercase text-slate-900 bg-slate-200 px-3 py-1.5 rounded border border-slate-300">
                            B. Rincian Detail Transaksi & Uraian per Kegiatan (Urut Kronologis: Jan s.d. Des, Tgl 1 s.d. 31)
                          </h5>
                          <table className="w-full text-left text-xs border-collapse">
                            <thead>
                              <tr className="border-b-2 border-slate-900 bg-slate-100 text-slate-900 font-bold">
                                <th className="p-2.5 border border-slate-300">Tanggal</th>
                                <th className="p-2.5 border border-slate-300">Jenis Kegiatan</th>
                                <th className="p-2.5 border border-slate-300">Kategori APBDes</th>
                                <th className="p-2.5 border border-slate-300">Uraian / Keterangan Transaksi</th>
                                <th className="p-2.5 border border-slate-300 text-right">Penerimaan (Rp)</th>
                                <th className="p-2.5 border border-slate-300 text-right">Pengeluaran (Rp)</th>
                                <th className="p-2.5 border border-slate-300 text-right">Saldo (Rp)</th>
                              </tr>
                            </thead>
                            <tbody>
                              {(() => {
                                let runningBal = 0;
                                const sortedTrx = sortTransactionsChronologically(transactions);
                                const filteredTrx = sortedTrx.filter(t => {
                                  const actName = t.activity && t.activity !== '-' ? t.activity : (t.category || 'Lainnya');
                                  return reportActivityFilter === 'Semua' || actName === reportActivityFilter;
                                });

                                if (filteredTrx.length === 0) {
                                  return (
                                    <tr>
                                      <td colSpan={7} className="p-4 text-center text-slate-500 italic border border-slate-300">Belum ada data rincian transaksi kegiatan</td>
                                    </tr>
                                  );
                                }

                                return filteredTrx.map((t, idx) => {
                                  const actName = t.activity && t.activity !== '-' ? t.activity : (t.category || 'Lainnya');
                                  const isInc = (t.type || '').toLowerCase().includes('pendapatan') || (t.type || '').toLowerCase() === 'in';
                                  const amt = Number(t.amount || 0);
                                  runningBal += isInc ? amt : -amt;

                                  return (
                                    <tr key={idx} className="border-b border-slate-200">
                                      <td className="p-2.5 border border-slate-300">{t.date}</td>
                                      <td className="p-2.5 border border-slate-300 font-bold text-emerald-900">{actName}</td>
                                      <td className="p-2.5 border border-slate-300">{t.category}</td>
                                      <td className="p-2.5 border border-slate-300 text-slate-800">{t.description}</td>
                                      <td className="p-2.5 border border-slate-300 text-right font-bold text-emerald-700">
                                        {isInc ? formatIDR(amt) : '-'}
                                      </td>
                                      <td className="p-2.5 border border-slate-300 text-right font-bold text-rose-700">
                                        {!isInc ? formatIDR(amt) : '-'}
                                      </td>
                                      <td className="p-2.5 border border-slate-300 text-right font-black text-slate-900">
                                        {formatIDR(runningBal)}
                                      </td>
                                    </tr>
                                  );
                                });
                              })()}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    <div className="grid grid-cols-2 pt-10 text-xs text-center font-medium page-break-inside-avoid">
                      <div className="space-y-16">
                        <p>Mengetahui,<br /><b>Kepala Desa {villageProfile.name}</b></p>
                        <p className="underline font-bold uppercase">{villageProfile.headOfVillage}</p>
                      </div>
                      <div className="space-y-16">
                        <p>{villageProfile.regency}, {new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}<br /><b>Kaur Keuangan / Bendahara</b></p>
                        <p className="underline font-bold uppercase">{villageProfile.treasurer}</p>
                      </div>
                    </div>

                  </div>
                </div>
              )}

              {activeMenu === 'cash_management' && (
                <div className="bg-white/[0.025] backdrop-blur-[40px] rounded-2xl p-6 border border-white/15 shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] space-y-6">
                  <div className="pb-4 border-b border-white/15">
                    <h2 className="text-lg font-bold text-slate-100">Manajemen Kas & Rekening Bank Desa</h2>
                    <p className="text-xs text-slate-400">Pengelolaan saldo kas tunai dan rekening bank</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {accounts.map(a => (
                      <div key={a.id} className="p-4 rounded-2xl border border-white/15 bg-white/[0.04] backdrop-blur-3xl space-y-3 shadow-inner">
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-xs font-bold text-slate-400 uppercase">{a.type}</span>
                            <h3 className="font-bold text-sm text-slate-100">{a.name}</h3>
                          </div>
                          {userPermissions.canEdit && (
                            <button
                              onClick={() => { setEditingAccount(a); setAccountForm({ name: a.name, balance: a.balance }); setIsModalAccountOpen(true); }}
                              className="bg-amber-950/30 text-amber-300 hover:bg-amber-900/40 border border-amber-500/30 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 backdrop-blur-3xl"
                            >
                              <i data-lucide="edit" className="w-3 h-3"></i> Edit
                            </button>
                          )}
                        </div>
                        <p className="text-xl font-black text-emerald-400">{formatIDR(a.balance)}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeMenu === 'audit' && (
                <div className="bg-white/[0.025] backdrop-blur-[40px] rounded-2xl p-6 border border-white/15 shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] space-y-6">
                  <div className="pb-4 border-b border-white/15">
                    <h2 className="text-lg font-bold text-slate-100">Audit Trail System</h2>
                    <p className="text-xs text-slate-400">Jejak aktivitas digital pengguna dan sistem</p>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-white/15 bg-white/[0.04] text-slate-300">
                          <th className="p-3">Waktu</th>
                          <th className="p-3">Pengguna</th>
                          <th className="p-3">Modul</th>
                          <th className="p-3">Aktivitas</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/10">
                        {auditLogs.map((log, idx) => (
                          <tr key={log.idKey || idx} className="hover:bg-white/[0.05] transition">
                            <td className="p-3 font-mono text-slate-400">{log.timestamp}</td>
                            <td className="p-3 font-bold text-emerald-400">{log.user}</td>
                            <td className="p-3"><span className="bg-white/[0.06] backdrop-blur-3xl px-2 py-0.5 rounded text-[10px] text-slate-300 border border-white/15">{log.module}</span></td>
                            <td className="p-3 font-medium text-slate-200">{log.action}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* MODAL TRANSAKSI */}
          {isModalTrxOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center p-4">
              <div className="bg-slate-950/60 backdrop-blur-[50px] rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-white/25 space-y-5">
                <div className="flex justify-between items-center border-b border-white/15 pb-3">
                  <h3 className="font-bold text-base text-slate-100">{editingTrx ? 'Edit Transaksi' : `Pencatatan Transaksi ${trxType}`} (Cloud)</h3>
                  <button onClick={() => setIsModalTrxOpen(false)} className="text-slate-400 hover:text-white"><i data-lucide="x-circle" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleSaveTransaction} className="space-y-4 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Kategori APBDes</label>
                    <select 
                      value={formData.category}
                      onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 font-medium backdrop-blur-3xl shadow-inner"
                      required
                    >
                      <option value="">-- Pilih Kategori --</option>
                      {budgetItems.filter(b => trxType === 'Pendapatan' ? b.category === 'Pendapatan' : b.category === 'Belanja').map(b => (
                        <option key={b.id} value={b.name} className="bg-slate-900">{b.code} - {b.name}</option>
                      ))}
                      <option value="Lainnya" className="bg-slate-900">➕ Lainnya (Input Kategori Baru...)</option>
                    </select>
                    {formData.category === 'Lainnya' && (
                      <input
                        type="text"
                        placeholder="Masukkan nama Kategori baru..."
                        value={formData.customCategory}
                        onChange={(e) => setFormData({ ...formData, customCategory: e.target.value })}
                        className="w-full mt-2 p-2.5 rounded-xl border border-emerald-500/50 bg-emerald-950/40 text-slate-100 font-medium backdrop-blur-3xl shadow-inner"
                        required
                      />
                    )}
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="font-bold text-slate-300">Kegiatan Terkait (Opsional)</label>
                      {formData.activity && formData.activity !== '-' && formData.activity !== 'Lainnya' && (
                        <span className="text-[11px] bg-emerald-950/80 text-emerald-300 px-2 py-0.5 rounded-md font-bold border border-emerald-500/30">
                          Saldo Kegiatan: {formatIDR(getActivityBalance(formData.activity))}
                        </span>
                      )}
                    </div>
                    <select
                      value={formData.activity}
                      onChange={(e) => {
                        const val = e.target.value;
                        setFormData({ 
                          ...formData, 
                          activity: val, 
                          customActivity: val === 'Lainnya' ? formData.customActivity : '' 
                        });
                      }}
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 font-medium backdrop-blur-3xl shadow-inner"
                    >
                      <option value="">-- Tanpa Kegiatan Khusus / Umum --</option>
                      {availableActivities.map((act, idx) => (
                        <option key={idx} value={act} className="bg-slate-900">{act} (Saldo: {formatIDR(getActivityBalance(act))})</option>
                      ))}
                      <option value="Lainnya" className="bg-slate-900">➕ Tambah Jenis Kegiatan Baru...</option>
                    </select>

                    {formData.activity === 'Lainnya' && (
                      <div className="mt-2 space-y-1">
                        <input
                          type="text"
                          placeholder="Ketik nama kegiatan baru (Contoh: Operasional PAUD)..."
                          value={formData.customActivity}
                          onChange={(e) => setFormData({ ...formData, customActivity: e.target.value })}
                          className="w-full p-2.5 rounded-xl border border-emerald-500/50 bg-emerald-950/40 text-slate-100 font-medium backdrop-blur-3xl shadow-inner"
                          autoFocus
                          required
                        />
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Uraian Transaksi</label>
                    <input 
                      type="text" 
                      placeholder="Contoh: Pembayaran Honor..." 
                      value={formData.description}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 backdrop-blur-3xl shadow-inner"
                      required
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Rekening Kas</label>
                      <select 
                        value={formData.accountId}
                        onChange={(e) => setFormData({ ...formData, accountId: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 backdrop-blur-3xl shadow-inner"
                      >
                        {accounts.map(a => (<option key={a.id} value={a.id} className="bg-slate-900">{a.name}</option>))}
                      </select>
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Nominal (Rp)</label>
                      <input 
                        type="number" 
                        placeholder="0" 
                        value={formData.amount}
                        onChange={(e) => setFormData({ ...formData, amount: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 font-bold backdrop-blur-3xl shadow-inner"
                        required
                      />
                    </div>
                  </div>
                  <div className="pt-3 flex gap-2 justify-end">
                    <button type="button" onClick={() => setIsModalTrxOpen(false)} className="px-4 py-2.5 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] backdrop-blur-3xl">Batal</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600/80 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/40 backdrop-blur-3xl">Simpan Perubahan</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL MASTER DESA */}
          {isModalMasterOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center p-4">
              <div className="bg-slate-950/60 backdrop-blur-[50px] rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-white/25 space-y-5">
                <div className="flex justify-between items-center border-b border-white/15 pb-3">
                  <h3 className="font-bold text-base text-slate-100">Edit Data Master & Pejabat Desa</h3>
                  <button onClick={() => setIsModalMasterOpen(false)} className="text-slate-400 hover:text-white"><i data-lucide="x-circle" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleSaveMaster} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Nama Desa</label>
                    <input type="text" value={masterForm.name} onChange={e => setMasterForm({...masterForm, name: e.target.value})} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 backdrop-blur-3xl shadow-inner" required />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Kecamatan</label>
                      <input type="text" value={masterForm.district} onChange={e => setMasterForm({...masterForm, district: e.target.value})} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 backdrop-blur-3xl shadow-inner" required />
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Kabupaten</label>
                      <input type="text" value={masterForm.regency} onChange={e => setMasterForm({...masterForm, regency: e.target.value})} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 backdrop-blur-3xl shadow-inner" required />
                    </div>
                  </div>
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Kepala Desa</label>
                    <input type="text" value={masterForm.headOfVillage} onChange={e => setMasterForm({...masterForm, headOfVillage: e.target.value})} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 backdrop-blur-3xl shadow-inner" required />
                  </div>
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Sekretaris Desa</label>
                    <input type="text" value={masterForm.secretary} onChange={e => setMasterForm({...masterForm, secretary: e.target.value})} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 backdrop-blur-3xl shadow-inner" required />
                  </div>
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Kaur Keuangan</label>
                    <input type="text" value={masterForm.treasurer} onChange={e => setMasterForm({...masterForm, treasurer: e.target.value})} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 backdrop-blur-3xl shadow-inner" required />
                  </div>
                  <div className="pt-3 flex gap-2 justify-end">
                    <button type="button" onClick={() => setIsModalMasterOpen(false)} className="px-4 py-2.5 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] backdrop-blur-3xl">Batal</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600/80 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/40 backdrop-blur-3xl">Simpan Profil</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL ANGGARAN */}
          {isModalBudgetOpen && editingBudget && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center p-4">
              <div className="bg-slate-950/60 backdrop-blur-[50px] rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-white/25 space-y-4">
                <h3 className="font-bold text-base text-slate-100">Edit Pagu Anggaran</h3>
                <p className="text-xs text-slate-400">{editingBudget.name}</p>
                <form onSubmit={handleSaveBudget} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Pagu Anggaran (Rp)</label>
                    <input type="number" value={budgetForm.budget} onChange={e => setBudgetForm({ budget: e.target.value })} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 font-bold backdrop-blur-3xl shadow-inner" required />
                  </div>
                  <div className="pt-2 flex gap-2 justify-end">
                    <button type="button" onClick={() => setIsModalBudgetOpen(false)} className="px-3.5 py-2 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] backdrop-blur-3xl">Batal</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-600/80 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/40 backdrop-blur-3xl">Simpan</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL REKENING */}
          {isModalAccountOpen && editingAccount && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center p-4">
              <div className="bg-slate-950/60 backdrop-blur-[50px] rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-white/25 space-y-4">
                <h3 className="font-bold text-base text-slate-100">Edit Akun Kas / Bank</h3>
                <form onSubmit={handleSaveAccount} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Nama Akun</label>
                    <input type="text" value={accountForm.name} onChange={e => setAccountForm({ ...accountForm, name: e.target.value })} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 backdrop-blur-3xl shadow-inner" required />
                  </div>
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Saldo Awal (Rp)</label>
                    <input type="number" value={accountForm.balance} onChange={e => setAccountForm({ ...accountForm, balance: e.target.value })} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 font-bold backdrop-blur-3xl shadow-inner" required />
                  </div>
                  <div className="pt-2 flex gap-2 justify-end">
                    <button type="button" onClick={() => setIsModalAccountOpen(false)} className="px-3.5 py-2 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] backdrop-blur-3xl">Batal</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-600/80 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/40 backdrop-blur-3xl">Simpan</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL UPLOAD ANIMASI */}
          {isUploading && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center p-4">
              <div className="bg-slate-950/60 backdrop-blur-[50px] rounded-3xl max-w-md w-full p-6 shadow-2xl border border-white/25 space-y-6 text-center">
                <div className="w-16 h-16 bg-emerald-950/80 text-emerald-400 rounded-full flex items-center justify-center mx-auto animate-pulse border border-emerald-400/40 shadow-inner">
                  <i data-lucide="refresh-cw" className="w-8 h-8 animate-spin"></i>
                </div>
                <div>
                  <h3 className="text-lg font-black text-slate-100">Sedang Mengimport Data</h3>
                  <p className="text-xs text-slate-400 mt-1">Sistem sedang memproses file dan mengirim data ke Cloud...</p>
                </div>
                <div className="space-y-2 text-left">
                  <div className="flex justify-between text-xs font-bold text-slate-300">
                    <span>{uploadStatusText}</span>
                    <span>{uploadProgressPct}%</span>
                  </div>
                  <div className="w-full bg-white/10 h-3 rounded-full overflow-hidden p-0.5 border border-white/20 backdrop-blur-3xl">
                    <div className="bg-emerald-500 h-full rounded-full transition-all duration-500 shadow-[0_0_12px_#10b981]" style={{ width: `${uploadProgressPct}%` }}></div>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
