    const getTransactionDirection = (type) => {
      const value = String(type || '').trim().toLowerCase();
      if (value === 'in' || value.includes('pendapatan') || value.includes('penerimaan') || value.includes('masuk')) return 'in';
      if (value === 'out' || value.includes('pengeluaran') || value.includes('belanja') || value.includes('keluar')) return 'out';
      return 'unknown';
    };

    // Normalisasi kategori agar variasi kapitalisasi dan spasi tidak memecah rekap.
    // Alias dibuat terbatas pada singkatan APBDes yang jelas; nama kategori lain tetap terpisah.
    const normalizeCategoryKey = (value) => {
      const raw = String(value || '').normalize('NFC').trim().toLowerCase().replace(/\s+/g, ' ');
      const aliases = {
        'dd': 'dana desa (dd)',
        'dana desa': 'dana desa (dd)',
        'pad': 'pendapatan asli desa (pad)',
        'pendapatan asli desa': 'pendapatan asli desa (pad)',
        'add': 'alokasi dana desa (add)',
        'alokasi dana desa': 'alokasi dana desa (add)',
        'bhp': 'bagi hasil pajak (bhp)',
        'bagi hasil pajak daerah': 'bagi hasil pajak (bhp)',
        'pbb dan iuran rk': 'pajak ppb dan iuran rk',
        'pajak pbb dan iuran rk': 'pajak ppb dan iuran rk'
      };
      return aliases[raw] || raw;
    };

    const getSafeAmount = (value) => {
      if (typeof value === 'number') return Number.isFinite(value) ? Math.round(value) : 0;
      if (value === null || value === undefined || value === '') return 0;
      let raw = String(value).trim();
      if (!raw) return 0;
      const isNegative = /^\s*-/.test(raw) || /^\(.*\)$/.test(raw);
      raw = raw.replace(/[()]/g, '').replace(/[^0-9,.]/g, '');
      if (!raw) return 0;
      // Format Indonesia: titik pemisah ribuan, koma desimal. Format angka biasa tetap diterima.
      if (raw.includes(',')) {
        raw = raw.replace(/\./g, '').replace(',', '.');
      } else if ((raw.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(raw)) {
        raw = raw.replace(/\./g, '');
      }
      const parsed = Number(raw);
      if (!Number.isFinite(parsed)) return 0;
      return Math.round(isNegative ? -Math.abs(parsed) : parsed);
    };

    const getTransactionYear = (value) => {
      const date = String(value || '').trim();
      const isoMatch = date.match(/^(\d{4})-\d{1,2}-\d{1,2}$/);
      const slashMatch = date.match(/^\d{1,2}\/\d{1,2}\/(\d{4})$/);
      return isoMatch ? isoMatch[1] : (slashMatch ? slashMatch[1] : '');
    };

    const isReportEligibleTransaction = (t, year) => {
      if (getTransactionYear(t.date) !== String(year)) return false;

      // Status kosong tetap diterima untuk kompatibilitas data lama.
      // Status yang terisi harus merupakan status persetujuan yang dikenal.
      if (status && !['disetujui', 'approved', 'approve', 'setuju', 'sudah disetujui'].includes(status)) return false;
      return getTransactionDirection(t.type) !== 'unknown' && getSafeAmount(t.amount) > 0;
    };

    const parseDateToNumber = (dateStr) => {
      if (!dateStr) return 0;
      if (dateStr.includes('-')) {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          return parseInt(`${parts[0]}${parts[1].padStart(2, '0')}${parts[2].padStart(2, '0')}`, 10);
        }
      } else if (dateStr.includes('/')) {
        const parts = dateStr.split('/');
        if (parts.length === 3) {
          return parseInt(`${parts[2]}${parts[1].padStart(2, '0')}${parts[0].padStart(2, '0')}`, 10);
        }
      }
      return 0;
    };

      return [...trxList].sort((a, b) => {
        const numA = parseDateToNumber(a.date);
        const numB = parseDateToNumber(b.date);
        if (numA !== numB) return numA - numB;
        if (a.type === 'Pendapatan' && b.type !== 'Pendapatan') return -1;
        if (a.type !== 'Pendapatan' && b.type === 'Pendapatan') return 1;
        return 0;
      });
    };

          updates[`transactions/${trxRef.key}`] = newTrx;
          await update(ref(db), updates);
          if (accounts.some(acc => acc.id === '101')) {

              acc.id === '101' ? { ...acc, balance: getSafeAmount(acc.balance) - amountNum } : acc

      // Hapus pinjaman beserta transaksi pencairan/pelunasan terkait.
      const handleDeleteLoan = async (loanItem) => {
        if (!userPermissions.canEdit) {

        if (!confirm(`Hapus data pinjaman ${loanItem.borrower} sebesar ${formatIDR(loanItem.amount)} beserta transaksi terkait?`)) return;
        const { db, ref, get, update, set } = window.FirebaseDB;
        try {
          const trxSnapshot = await get(ref(db, 'transactions'));
          const trxTree = trxSnapshot.val() || {};
          const relatedTransactions = Object.entries(trxTree)
            .filter(([, t]) => t && (t.id === `TRX-OUT-${loanItem.id}` || t.id === `TRX-IN-LUNAS-${loanItem.id}`))
            .map(([idKey, t]) => ({ idKey, ...t }));
          const updates = { [`loans/${loanItem.idKey}`]: null };
          relatedTransactions.forEach(t => { updates[`transactions/${t.idKey}`] = null; });
          await update(ref(db), updates);

          // Jika belum lunas, kas dikembalikan karena transaksi pencairan dihapus.

              acc.id === '101' ? { ...acc, balance: getSafeAmount(acc.balance) + getSafeAmount(loanItem.amount) } : acc
            ));

      // 2. Pengembalian / Pelunasan Pinjaman (Menambah Kas, Menambah Saldo Kegiatan, Masuk Pendapatan)

      const getActivityBalance = (activityName) => {

          if (direction === 'out') return balance - amount;

      // Asisten Analisis & Pencarian Lintas-Database SIKUDES.
      // Nominal selalu dihitung secara deterministik dari snapshot Firebase, bukan dikarang AI generatif.
      const handleAskFinancialAssistant = async (questionOverride) => {
        const question = String(questionOverride ?? assistantQuestion).trim();
        if (!question) return;
        const followUp = /^(dan|lalu|kemudian|sekarang|buatkan|tampilkan|uraikan|rincikan|bandingkan|kelompokkan|rekap|cetak|simpan|ubah|tambahkan|yang tadi|hasil tadi|perinci|lanjutkan)\b/i.test(question)
          || /\b(tersebut|itu|yang tadi|hasil sebelumnya|data tadi)\b/i.test(question);
        const effectiveQuestion = followUp && assistantLastQuestion
          ? `${assistantLastQuestion}. Permintaan lanjutan: ${question}`
          : question;
        const printOnlyCommand = /^(cetak|print|unduh|download|simpan|jadikan|buatkan)\b/.test(question.toLocaleLowerCase('id-ID'))
          && /(pdf|hasil|data|laporan|itu|tersebut)/.test(question.toLocaleLowerCase('id-ID'));
        if (printOnlyCommand && assistantResult) {
          handlePrintAssistantResult();
          return;
        }
        setAssistantQuestion(question);
        setAssistantLastQuestion(effectiveQuestion);
        setAssistantLoading(true);
        setAssistantResult(null);
        setAssistantExpandedSource(null);
        try {
          if (!window.FirebaseDB || !window.FirebaseDB.db) throw new Error('Koneksi Firebase belum siap. Muat ulang halaman dan coba lagi.');
          const { db, ref, get } = window.FirebaseDB;
          const paths = ['transactions', 'accounts', 'budgetItems', 'loans', 'villageDebts', 'auditLogs', 'bookClosures', 'villageProfile'];
          const snapshots = await Promise.all(paths.map(path => get(ref(db, path))));
          const raw = Object.fromEntries(paths.map((path, index) => [path, snapshots[index].val()]));
          const asList = (value, withKey = false) => {
            if (Array.isArray(value)) return value.filter(Boolean).map((v, i) => withKey ? ({ idKey: String(i), ...(v || {}) }) : v);
            if (value && typeof value === 'object') return Object.entries(value).map(([key, v]) => withKey ? ({ idKey: key, ...(v || {}) }) : (v || {}));
            return [];
          };
          const allTransactions = asList(raw.transactions, true);
          const liveAccounts = asList(raw.accounts);
          const liveBudgets = asList(raw.budgetItems);
          const liveLoans = asList(raw.loans, true);
          const liveDebts = asList(raw.villageDebts, true);
          const liveAudit = asList(raw.auditLogs, true);
          const q = effectiveQuestion.toLocaleLowerCase('id-ID').normalize('NFC').replace(/[’']/g, '');
          const monthNames = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
          const monthAliases = ['jan','feb','mar','apr','mei','jun','jul','agu','sep','okt','nov','des'];

              if (!groups.has(key)) groups.set(key,{name:`${monthLabels[d.month]} ${d.year}`,number:key,type:'Bulanan',balance:0,realized:0,remaining:0,percent:null,income:0,expense:0,count:0});
              const g=groups.get(key), amount=getSafeAmount(t.amount);
              if (getTransactionDirection(t.type)==='in') g.income+=amount;
              if (getTransactionDirection(t.type)==='out') g.expense+=amount;
              g.count++;
            });
            const rows=[...groups.values()].sort((a,b)=>a.number.localeCompare(b.number)).map(g=>({...g, balance:g.income, realized:g.expense, remaining:g.income-g.expense}));
            setAssistantResult({title:'Rekap Pendapatan dan Belanja Per Bulan',summary:`${rows.length} bulan memiliki transaksi pada ${yearLabel}`,type:'budget-list',details:rows,note:'Pendapatan dan belanja dikelompokkan berdasarkan tanggal transaksi. Kolom Pagu/Realisasi pada tampilan rekap mewakili pendapatan, belanja, dan selisih bersih bulanan; bukan pagu anggaran.'});
          }
          else if (/per bidang|tiap bidang|setiap bidang|berdasarkan bidang/.test(q)) {
            const groups = new Map();
            periodTransactions.forEach(t => {
              const label = String(t.bidang || t.field || t.fieldName || t.category || t.activity || 'Bidang tidak tercatat').trim();
              if (!groups.has(label)) groups.set(label,{name:label,number:'',type:'Bidang',balance:0,realized:0,remaining:0,percent:null,income:0,expense:0,count:0});
              const g=groups.get(label), amount=getSafeAmount(t.amount);
              if(getTransactionDirection(t.type)==='in') g.income+=amount;
              if(getTransactionDirection(t.type)==='out') g.expense+=amount;
              g.count++;
            });
            const rows=[...groups.values()].sort((a,b)=>(b.income+b.expense)-(a.income+a.expense)).map(g=>({...g,balance:g.income,realized:g.expense,remaining:g.income-g.expense}));
            setAssistantResult({title:'Rekap Keuangan Per Bidang',summary:`${rows.length} kelompok bidang/kategori ditemukan`,type:'budget-list',details:rows,note:'Pengelompokan menggunakan kolom bidang/field jika tersedia; jika tidak tersedia, sistem memakai kategori transaksi, lalu nama kegiatan. Periksa label kelompok sebelum digunakan sebagai laporan resmi.'});
          }
          else if (/per sumber dana|tiap sumber dana|setiap sumber dana|berdasarkan sumber dana/.test(q)) {
            const groups = new Map();
            periodTransactions.forEach(t => {
              const label = String(t.fundSource || t.fundingSource || t.sourceOfFund || t.sumberDana || t.source || t.accountName || t.accountId || 'Sumber dana tidak tercatat').trim();
              if (!groups.has(label)) groups.set(label,{name:label,number:'',type:'Sumber Dana',balance:0,realized:0,remaining:0,percent:null,income:0,expense:0,count:0});
              const g=groups.get(label), amount=getSafeAmount(t.amount);
              if(getTransactionDirection(t.type)==='in') g.income+=amount;
              if(getTransactionDirection(t.type)==='out') g.expense+=amount;
              g.count++;
            });
            const rows=[...groups.values()].sort((a,b)=>(b.income+b.expense)-(a.income+a.expense)).map(g=>({...g,balance:g.income,realized:g.expense,remaining:g.income-g.expense}));
            setAssistantResult({title:'Rekap Pendapatan dan Belanja Per Sumber Dana',summary:`${rows.length} sumber dana/rekening ditemukan`,type:'budget-list',details:rows,note:'Sistem memakai kolom sumber dana yang tersedia pada transaksi. Jika sumber dana tidak tersimpan, pengelompokan memakai rekening transaksi; periksa kembali sebelum pelaporan.'});
          }
          // Perbandingan pagu dan realisasi seluruh pos, terpisah pendapatan dan belanja.
          else if (/bandingkan|perbandingan/.test(q) && /(anggaran|pagu|realisasi)/.test(q)) {
            const rows = liveBudgets.map(b => {
              const direction = /pendapatan/i.test(String(b.category || b.type || '')) ? 'in' : 'out';
              const matched = validTransactions.filter(t => normalizeCategoryKey(t.category)===normalizeCategoryKey(b.name) && getTransactionDirection(t.type)===direction);
              const budget=getSafeAmount(b.budget), realized=total(matched);
              return {name:b.name||'Pos tanpa nama',number:b.code||'',type:b.category||'Belanja',balance:budget,realized,remaining:budget-realized,percent:budget>0?realized/budget*100:null};
            });
            setAssistantResult({title:'Perbandingan Anggaran dan Realisasi APBDes',summary:`${rows.length} pos anggaran dibandingkan`,type:'budget-list',details:rows,note:'Realisasi dihitung dengan mencocokkan kategori transaksi dan arah pendapatan/belanja. Pos yang tidak cocok dapat menunjukkan realisasi nol; pastikan penamaan kategori konsisten.'});
          }
          // Saldo bersih kegiatan dihitung dari pendapatan dikurangi pengeluaran.
          else if (/saldo kegiatan|sisa dana kegiatan|dana kegiatan/.test(q)) {
            const target = cleanTerms.join(' ');
            const related = validTransactions.filter(t => `${t.activity || ''} ${t.category || ''}`.toLowerCase().includes(target));
            const incoming = total(related.filter(t=>getTransactionDirection(t.type)==='in'));
            const outgoing = total(related.filter(t=>getTransactionDirection(t.type)==='out'));
            setAssistantResult({ title: 'Saldo bersih kegiatan', summary: formatIDR(incoming-outgoing), type: 'transactions', details:makeTransactionDetails(related), totalCount:related.length,totalAmount:incoming-outgoing,note:`Pendapatan terkait ${formatIDR(incoming)} dikurangi pengeluaran ${formatIDR(outgoing)}. Sumber: Firebase /transactions, ${yearLabel}.` });
          }
          // Pencarian umum lintas field transaksi: pengguna bebas menyebut kegiatan, kategori, rekening, penerima, ID, atau uraian.
          else {
            let candidates = allTransactions.filter(t => allYears || !dateParts(t.date).year || dateParts(t.date).year === year);
            if (monthIndex >= 0) candidates = candidates.filter(t => dateParts(t.date).month === monthIndex);
            if (directionFilter) candidates = candidates.filter(t=>getTransactionDirection(t.type)===directionFilter);
            if (amountThreshold !== null) candidates = candidates.filter(t=>getSafeAmount(t.amount)>=amountThreshold);
            const ranked = candidates.map(t=>({t,score:termScore(normalizedText(t))})).filter(x=>cleanTerms.length ? x.score>0 : transactionQuery).sort((a,b)=>b.score-a.score || getSafeAmount(b.t.amount)-getSafeAmount(a.t.amount));
            const found = ranked.map(x=>x.t);
            if (found.length) setAssistantResult(showTransactions(found, 'Hasil pencarian seluruh transaksi', `Ditemukan ${found.length} data yang cocok. ${cleanTerms.length ? 'Pencocokan dilakukan pada ID, kategori, kegiatan, uraian, rekening, penerima, dan status.' : 'Hasil mengikuti filter pertanyaan.'}`));
            else {
              const availableNodes = paths.filter(path => raw[path] !== null && raw[path] !== undefined);
              setAssistantResult({ title: 'Belum menemukan data yang cocok', summary: 'Tidak ada data yang cukup cocok untuk menjawab pertanyaan tersebut.', details: [], note: `Database yang berhasil diperiksa: ${availableNodes.join(', ') || 'belum ada node yang terbaca'}. Coba sebutkan nama kegiatan, kategori APBDes, rekening, bulan, ID transaksi, pinjaman, hutang, atau audit log. Sistem tidak membuat angka perkiraan.` });
            }
          }
        } catch (error) {
          console.error('Asisten keuangan gagal membaca Firebase:', error);
          setAssistantResult({ title: 'Tidak dapat membaca data', summary: error.message || 'Terjadi kendala saat mengambil data langsung dari Firebase.', details: [], note: 'Nominal tidak ditampilkan karena sumber data belum berhasil diverifikasi.' });
        } finally {
          setAssistantLoading(false);
        }
      };

      // Laporan keterangan hanya mengambil transaksi pendapatan yang valid pada tahun terpilih.
      // Pencarian tidak peka huruf besar/kecil dan mencocokkan teks di bagian mana pun dari keterangan.
      const descriptionRevenueTransactions = useMemo(() => {
        const keyword = String(reportDescriptionFilter || '').trim().toLocaleLowerCase('id-ID');
        return sortTransactionsChronologically(reportTransactions.filter(t =>
          getTransactionDirection(t.type) === 'in' &&
          (!keyword || String(t.description || '').toLocaleLowerCase('id-ID').includes(keyword))
        ));
      }, [reportTransactions, reportDescriptionFilter]);

      const descriptionRevenueTotal = useMemo(() =>
        descriptionRevenueTransactions.reduce((sum, t) => sum + getSafeAmount(t.amount), 0),
      [descriptionRevenueTransactions]);

      // Rekap otomatis berdasarkan keterangan persis dan bulan transaksi.
      const descriptionRevenueBySource = useMemo(() => {
        const groups = new Map();
        descriptionRevenueTransactions.forEach(t => {
          const label = String(t.description || '').trim() || '(Tanpa Keterangan)';
          const key = label.toLocaleLowerCase('id-ID');
          if (!groups.has(key)) groups.set(key, { label, count: 0, total: 0 });
          const item = groups.get(key);
          item.count += 1;
          item.total += getSafeAmount(t.amount);
        });
        return Array.from(groups.values()).sort((a, b) => b.total - a.total);
      }, [descriptionRevenueTransactions]);

      const descriptionRevenueByMonth = useMemo(() => {
        const groups = new Map();
        const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        descriptionRevenueTransactions.forEach(t => {
          const raw = String(t.date || '');
          let year = '', month = '';
          let match = raw.match(/^(\d{4})-(\d{1,2})/);
          if (match) { year = match[1]; month = Number(match[2]); }
          else {
            match = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
            if (match) { month = Number(match[2]); year = match[3]; }
          }
          const key = year && month >= 1 && month <= 12 ? `${year}-${String(month).padStart(2, '0')}` : 'Tanggal tidak dikenali';
          if (!groups.has(key)) groups.set(key, { key, monthLabel: key === 'Tanggal tidak dikenali' ? key : `${monthNames[month - 1]} ${year}`, count: 0, total: 0 });
          const item = groups.get(key);
          item.count += 1;
          item.total += getSafeAmount(t.amount);
        });
        return Array.from(groups.values()).sort((a, b) => a.key.localeCompare(b.key));
      }, [descriptionRevenueTransactions]);

      const financialSummary = useMemo(() => {
        const totalBudgetRevenue = budgetItems.filter(i => i.category === 'Pendapatan').reduce((acc, curr) => acc + (curr.budget || 0), 0);
        const totalBudgetExpenditure = budgetItems.filter(i => i.category === 'Belanja').reduce((acc, curr) => acc + (curr.budget || 0), 0);
        
        const approvedRevenue = reportTransactions
          .filter(t => getTransactionDirection(t.type) === 'in')
          .reduce((acc, curr) => acc + getSafeAmount(curr.amount), 0);

        const approvedExpenditure = reportTransactions
          .filter(t => getTransactionDirection(t.type) === 'out')
          .reduce((acc, curr) => acc + getSafeAmount(curr.amount), 0);
        
        // PERUBAHAN DI SINI: Total Kas Aktif menjumlahkan saldo dari seluruh akun (Kas Tunai + Bank Jatim + Bank BRI, dll)
        const totalCashBalance = accounts.reduce((acc, curr) => acc + Number(curr.balance || 0), 0);
        
        const absorptionRate = totalBudgetExpenditure > 0 ? ((approvedExpenditure / totalBudgetExpenditure) * 100).toFixed(1) : '0';

        return { totalBudgetRevenue, totalBudgetExpenditure, approvedRevenue, approvedExpenditure, totalCashBalance, absorptionRate };
      }, [budgetItems, reportTransactions, accounts]); // Ringkasan mengikuti tahun anggaran terpilih

      const recentTransactions = useMemo(() => {
        return [...transactions].reverse().slice(0, 5);
      }, [transactions]);

      const monthlyChartData = useMemo(() => {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const revByMonth = new Array(12).fill(0);
        const expByMonth = new Array(12).fill(0);

        reportTransactions.forEach(t => {
          if (!t.date) return;
          let monthIndex = -1;
          if (t.date.includes('-')) {
            const parts = t.date.split('-');
            if (parts.length >= 2) monthIndex = parseInt(parts[1], 10) - 1;
          } else if (t.date.includes('/')) {
            const parts = t.date.split('/');
            if (parts.length >= 2) monthIndex = parseInt(parts[1], 10) - 1;
          }

          if (monthIndex >= 0 && monthIndex < 12) {
            const amt = getSafeAmount(t.amount);
            const direction = getTransactionDirection(t.type);
            if (direction === 'in') revByMonth[monthIndex] += amt;
            else if (direction === 'out') expByMonth[monthIndex] += amt;
          }
        });

        return months.map((m, idx) => ({
          month: m,
          revenue: revByMonth[idx],
          expense: expByMonth[idx]
        }));
      }, [reportTransactions]);

      const activityBreakdown = useMemo(() => {
        const map = new Map();
        reportTransactions.forEach(t => {
          const act = t.activity && t.activity !== '-' ? t.activity : (t.category || 'Lainnya');
          const amt = getSafeAmount(t.amount);
          const isInc = getTransactionDirection(t.type) === 'in';

          if (!map.has(act)) {
            map.set(act, { totalIn: 0, totalOut: 0, count: 0 });
          }
          const item = map.get(act);
          if (isInc) item.totalIn += amt;
          else item.totalOut += amt;
          item.count += 1;
        });

        return Array.from(map.entries()).map(([name, stat]) => ({
          name,
          ...stat,
          net: stat.totalIn - stat.totalOut
        })).sort((a, b) => b.totalOut - a.totalOut);
      }, [reportTransactions]);

      const categoryBreakdown = useMemo(() => {
        const map = new Map();
        reportTransactions.forEach(t => {
          const rawCat = String(t.category || 'Umum').trim() || 'Umum';
          const mapKey = normalizeCategoryKey(rawCat);
          // Gunakan nama baku dari master anggaran bila tersedia agar label laporan konsisten.
          const masterCategory = budgetItems.find(item => normalizeCategoryKey(item.name) === mapKey);
          if (!map.has(mapKey)) {
            map.set(mapKey, { name: masterCategory ? masterCategory.name : rawCat, totalIn: 0, totalOut: 0 });
          }
          const item = map.get(mapKey);
          const amt = getSafeAmount(t.amount);
          const direction = getTransactionDirection(t.type);
          if (direction === 'in') item.totalIn += amt;
          else if (direction === 'out') item.totalOut += amt;
        });
        return Array.from(map.values()).sort((a, b) => (b.totalIn + b.totalOut) - (a.totalIn + a.totalOut));
      }, [reportTransactions, budgetItems]);

      // Audit kategori/kegiatan membaca seluruh transaksi pada tahun terpilih,
      // termasuk transaksi yang belum lolos kriteria laporan agar anomali tidak tersembunyi.
      const [auditCategoryFilter, setAuditCategoryFilter] = useState('Semua');

      const financialReconciliationAudit = useMemo(() => {
        const yearTransactions = transactions.filter(t => getTransactionYear(t.date) === String(selectedYear));
        const categoryOptions = [...new Set(yearTransactions
          .map(t => String(t.category || '').trim())
          .filter(Boolean))].sort((a, b) => a.localeCompare(b, 'id'));

        const categoryScoped = yearTransactions.filter(t =>
          auditCategoryFilter === 'Semua' ||
          normalizeCategoryKey(t.category) === normalizeCategoryKey(auditCategoryFilter)
        );
        const activityNameOf = t => {
          const raw = String(t.activity || '').trim();
          return raw && raw !== '-' ? raw : (String(t.category || '').trim() || 'Kegiatan belum diisi');
        };
        const activityOptions = [...new Set(categoryScoped.map(activityNameOf))]
          .sort((a, b) => a.localeCompare(b, 'id'));

        const scopedTransactions = categoryScoped.filter(t =>
          auditActivityFilter === 'Semua' ||
          activityNameOf(t).toLocaleLowerCase('id-ID') === auditActivityFilter.toLocaleLowerCase('id-ID')
        );

        const duplicateGroups = new Map();
        scopedTransactions.forEach(t => {
          const key = [
            String(t.date || '').trim(),
            getSafeAmount(t.amount),
            normalizeCategoryKey(t.category),
            String(t.description || t.uraian || t.keterangan || '').trim().toLocaleLowerCase('id-ID'),
            getTransactionDirection(t.type)
          ].join('|');
          if (!duplicateGroups.has(key)) duplicateGroups.set(key, []);
          duplicateGroups.get(key).push(t);
        });
        const duplicateIds = new Set();
        duplicateGroups.forEach(group => {
          if (group.length > 1) group.forEach(t => duplicateIds.add(t.idKey || t.id));
        });

        const rows = [];
        const categoryTotals = new Map();
        const activityTotals = new Map();

        scopedTransactions.forEach(t => {
          const categoryName = String(t.category || '').trim();
          const rawActivity = String(t.activity || '').trim();
          const activityName = activityNameOf(t);
          const direction = getTransactionDirection(t.type);
          const amount = getSafeAmount(t.amount);
          const status = String(t.status || '').trim().toLowerCase();
          const issues = [];

          if (!categoryName || categoryName === '-') issues.push('Kategori APBDes belum diisi');
          if (!rawActivity || rawActivity === '-') issues.push('Kegiatan terkait belum diisi');
          if (direction === 'unknown') issues.push('Jenis transaksi tidak dikenali');
          if (!(amount > 0)) issues.push('Nominal kosong, nol, atau tidak valid');
          if (status && !['disetujui', 'approved', 'approve', 'setuju', 'sudah disetujui'].includes(status)) {
            issues.push(`Status belum disetujui (${t.status})`);
          }
          if (duplicateIds.has(t.idKey || t.id)) issues.push('Indikasi transaksi duplikat: tanggal, kategori, jenis, nominal, dan uraian sama');
          if (direction === 'out' && !(t.photo || t.receipt || t.receiptUrl || t.evidence || t.buktiTransaksi)) {
            issues.push('Bukti transaksi belum terlampir');
          }

          if (issues.length) {
            rows.push({
              date: t.date || '-',
              id: t.id || t.idKey || t.key || '-',
              description: t.description || t.uraian || t.keterangan || '-',
              category: categoryName || '-',
              activity: activityName || '-',
              type: t.type || '-',
              direction,
              amount,
              issues
            });
          }

          const catKey = normalizeCategoryKey(categoryName || 'Kategori belum diisi');
          if (!categoryTotals.has(catKey)) categoryTotals.set(catKey, {
            name: categoryName || 'Kategori belum diisi', totalIn: 0, totalOut: 0, count: 0
          });
          const cat = categoryTotals.get(catKey);
          if (direction === 'in') cat.totalIn += amount;
          else if (direction === 'out') cat.totalOut += amount;
          cat.count += 1;

          const actKey = String(activityName).toLocaleLowerCase('id-ID');
          if (!activityTotals.has(actKey)) activityTotals.set(actKey, {
            name: activityName, totalIn: 0, totalOut: 0, count: 0
          });
          const act = activityTotals.get(actKey);
          if (direction === 'in') act.totalIn += amount;
          else if (direction === 'out') act.totalOut += amount;
          act.count += 1;
        });

        const categoryComparisons = Array.from(categoryTotals.values())
          .map(item => ({ ...item, categoryNet: item.totalIn - item.totalOut }))
          .sort((a, b) => (b.totalIn + b.totalOut) - (a.totalIn + a.totalOut));
        const activitySummary = Array.from(activityTotals.values())
          .map(item => ({ ...item, net: item.totalIn - item.totalOut }))
          .sort((a, b) => (b.totalIn + b.totalOut) - (a.totalIn + a.totalOut));

        return {
          rows: sortTransactionsChronologically(rows),
          categoryComparisons,
          activitySummary,
          categoryOptions,
          activityOptions,
          checkedTransactions: scopedTransactions.length,
          issueCount: rows.length,
          categoryCount: categoryTotals.size,
          activityFilter: auditActivityFilter,
          categoryFilter: auditCategoryFilter
        };
      }, [transactions, selectedYear, auditCategoryFilter, auditActivityFilter]);

      const canViewFinancialAudit = !!currentUser && ['kaur_keuangan', 'sekdes'].includes(currentUser.role);

      // Cetak khusus BKU: seluruh data sesuai filter (bukan hanya halaman aktif).
      // Saldo berjalan dihitung hanya dari transaksi yang lolos filter kategori dan kegiatan.
      const handlePrintBKU = () => {
        const printWindow = window.open('', '_blank', 'width=1100,height=750');
        if (!printWindow) {
          showToast('⚠️ Pop-up diblokir oleh browser. Izinkan pop-up untuk mencetak BKU.');
          return;
        }

        const esc = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
        const money = (value) => formatIDR(Number(value || 0));
        // Terapkan seluruh filter terlebih dahulu. Saldo dimulai dari nol pada
        // transaksi pertama yang benar-benar tampil sesuai filter BKU.
        const sorted = sortTransactionsChronologically(reportTransactions || []);
        const selectedRows = sorted.filter(t => {
          const matchCategory = bkuCategoryFilter === 'Semua' || t.category === bkuCategoryFilter;
          const activityName = t.activity && t.activity !== '-' ? t.activity : (t.category || 'Lainnya');
          const matchActivity = bkuActivityFilter === 'Semua' || activityName === bkuActivityFilter;
          return matchCategory && matchActivity;
        });
        let runningBalance = 0;
        const filteredRows = selectedRows.map(t => {
          const direction = getTransactionDirection(t.type);
          const amount = getSafeAmount(t.amount);
          runningBalance += direction === 'in' ? amount : (direction === 'out' ? -amount : 0);
          return { ...t, direction, amount, currentBalance: runningBalance };
        });
        const totalIn = filteredRows.reduce((sum, t) => sum + (t.direction === 'in' ? t.amount : 0), 0);
        const totalOut = filteredRows.reduce((sum, t) => sum + (t.direction === 'out' ? t.amount : 0), 0);
        const rowsHtml = filteredRows.map((t, index) => `
          <tr>
            <td class="center">${index + 1}</td>
            <td class="nowrap">${esc(t.date || '-')}</td>
            <td>${esc(t.category || '-')}</td>
            <td>${esc(t.activity || '-')}</td>
            <td>${esc(t.description || '-')}</td>
            <td class="num income">${t.direction === 'in' ? money(t.amount) : '-'}</td>
            <td class="num expense">${t.direction === 'out' ? money(t.amount) : '-'}</td>
            <td class="num balance">${money(t.currentBalance)}</td>
          </tr>`).join('');

        const villageName = villageProfile?.name || 'DESA';
        const regency = villageProfile?.regency || 'LAMONGAN';
        const district = villageProfile?.district || 'KECAMATAN';
        const categoryLabel = bkuCategoryFilter === 'Semua' ? 'Semua Kategori' : bkuCategoryFilter;
        const activityLabel = bkuActivityFilter === 'Semua' ? 'Semua Kegiatan' : bkuActivityFilter;
        const generatedAt = new Date().toLocaleString('id-ID');
        const html = `<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>Buku Kas Umum - ${esc(villageName)} - ${esc(selectedYear)}</title>
          <style>
            *{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111827;margin:0;padding:22px;font-size:10px}
            .kop{text-align:center;border-bottom:3px double #111827;padding-bottom:12px;margin-bottom:16px}
            .kop .line{font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:3px 0}
            .kop h1{font-size:17px;margin:7px 0 4px}.kop .subtitle{font-size:12px;font-weight:bold;color:#065f46}
            h2{text-align:center;font-size:15px;margin:14px 0 5px}.sub{text-align:center;color:#475569;margin-bottom:14px}
            .filters{display:flex;justify-content:space-between;gap:16px;border:1px solid #cbd5e1;padding:8px;margin-bottom:10px}

      // Tutup buku: arsipkan saldo bersih per kegiatan dan pindahkan totalnya
      // sebagai Saldo Tahun Lalu pada PAD tanggal 1 Januari tahun berikutnya.
      const handleCloseFiscalYear = async () => {
        if (!currentUser || currentUser.role !== 'admin') {
          showToast('⚠️ Tutup buku hanya dapat dilakukan Administrator.');
          return;
        }
        const year = String(villageProfile.fiscalYear || selectedYear);
        if (closedBooks && closedBooks[year]) {
          showToast(`⚠️ Tahun anggaran ${year} sudah pernah ditutup.`);
          return;
        }
        if (!confirm(`Tutup buku Tahun Anggaran ${year}? Data lama tetap disimpan. Saldo bersih seluruh kegiatan akan dicatat sebagai Saldo Tahun Lalu pada PAD Tahun ${Number(year) + 1}. Proses ini tidak dapat dibatalkan dari aplikasi.`)) return;

        const { db, ref, get, push, runTransaction, update, set } = window.FirebaseDB;
        let closureLocked = false;
        try {
          const snapshot = await get(ref(db));
          const cloud = snapshot.val() || {};
          const rawTransactions = cloud.transactions || {};
          const yearTransactions = Object.values(rawTransactions).filter(t =>
            getTransactionYear(t.date) === year &&
            getTransactionDirection(t.type) !== 'unknown' &&
            getSafeAmount(t.amount) > 0 &&
            (!t.status || ['disetujui', 'approved', 'approve', 'setuju', 'sudah disetujui'].includes(String(t.status).trim().toLowerCase()))
          );

          const activityBalances = {};
          yearTransactions.forEach(t => {
            const activity = String(t.activity && t.activity !== '-' ? t.activity : (t.category || 'Lainnya')).trim();
            const direction = getTransactionDirection(t.type);
            activityBalances[activity] = (activityBalances[activity] || 0) +
              (direction === 'in' ? getSafeAmount(t.amount) : -getSafeAmount(t.amount));
          });
          const netCarryForward = Object.values(activityBalances).reduce((sum, value) => sum + value, 0);
          if (netCarryForward < 0) {
            showToast(`⚠️ Saldo bersih TA ${year} negatif (${formatIDR(netCarryForward)}). Tutup buku dihentikan agar tidak dicatat keliru sebagai pendapatan PAD.`);
            return;
          }

          const nextYear = String(Number(year) + 1);
          const nextProfile = { ...(cloud.villageProfile || villageProfile), fiscalYear: nextYear };
          const carryTrxRef = netCarryForward > 0 ? push(ref(db, 'transactions')) : null;
          const carryTransaction = netCarryForward > 0 ? {
            id: `SALDO-TAHUN-LALU-${year}`,
            date: `${nextYear}-01-01`,
            type: 'Pendapatan',
            category: 'Pendapatan Asli Desa (PAD)',
            activity: 'Pendapatan Asli Desa (PAD)',
            description: `Saldo Tahun Lalu hasil tutup buku TA ${year}`,
            accountId: '101',
            accountName: 'Kas Bendahara Desa',
            amount: netCarryForward,
            netAmount: netCarryForward,
            status: 'Disetujui',
            approvedBy: currentUser.name,
            source: 'year-end-closing',
            sourceYear: year
          } : null;

          const closureRecord = {
            year,
            nextYear,
            closedAt: new Date().toISOString(),
            closedBy: currentUser.name,
            activityBalances,
            totalSaldoTahunLalu: netCarryForward,
            carryTransactionKey: carryTrxRef ? carryTrxRef.key : null,
            transactionCount: yearTransactions.length
          };

          // Kunci tutup buku atomik: satu tahun hanya dapat ditutup satu kali.
          const closureResult = await runTransaction(ref(db, `bookClosures/${year}`), current =>
            current === null ? closureRecord : undefined
          );
          if (!closureResult.committed) {
            showToast(`⚠️ Tahun ${year} sudah ditutup oleh pengguna lain.`);
            return;
          }
          closureLocked = true;

          const updates = { villageProfile: nextProfile };
          if (carryTrxRef && carryTransaction) updates[`transactions/${carryTrxRef.key}`] = carryTransaction;
          await update(ref(db), updates);
          closureLocked = false;
          setVillageProfile(nextProfile);
          setSelectedYear(nextYear);
          showToast(`✅ Tutup buku TA ${year} berhasil. Saldo tahun lalu ${formatIDR(netCarryForward)} dicatat ke PAD TA ${nextYear}.`);

          const auditRef = push(ref(db, 'auditLogs'));
          await update(ref(db), {
            [`auditLogs/${auditRef.key}`]: {
              timestamp: new Date().toLocaleString('id-ID'),
              user: currentUser.name,
              action: `Tutup buku TA ${year}; saldo tahun lalu ${formatIDR(netCarryForward)} dipindahkan ke PAD TA ${nextYear}`,
              module: 'Tutup Buku'
            }
          });
        } catch (err) {
          console.error('Tutup buku gagal:', err);
          if (closureLocked) {
            try { await set(ref(db, `bookClosures/${year}`), null); } catch (unlockError) {
              console.error('Gagal melepas kunci tutup buku:', unlockError);
            }
          }
          showToast('❌ Tutup buku gagal. Periksa koneksi dan status Firebase.');
        }
      };

      // Backup seluruh root Firebase Realtime Database.
      const handleBackupCloud = async () => {
        if (!currentUser || currentUser.role !== 'admin') {
          showToast('⚠️ Backup hanya dapat dilakukan Administrator.');
          return;
        }
        try {
          const { db, ref, get } = window.FirebaseDB;
          const snapshot = await get(ref(db));
          if (!snapshot.exists()) {
            showToast('⚠️ Database Cloud masih kosong.');
            return;
          }
          const backupPackage = {
            backupType: 'SIKUDES_CLOUD_FULL_BACKUP',
            backupVersion: 1,
            createdAt: new Date().toISOString(),
            createdBy: currentUser.name,
            database: snapshot.val()
          };
          const blob = new Blob([JSON.stringify(backupPackage, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `Backup_SIKUDES_${villageProfile.name.replace(/\s+/g, '_')}_${getLocalDateString()}.json`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1500);
          showToast('✅ Backup seluruh database Cloud berhasil diunduh.');
        } catch (err) {
          console.error('Backup gagal:', err);
          showToast('❌ Backup gagal. Periksa koneksi Firebase.');
        }
      };

      // Restore mengganti isi root database. Sebelum restore, kondisi cloud saat ini
      // otomatis diunduh sebagai file pengaman.
      const handleRestoreCloud = async (event) => {
        if (!currentUser || currentUser.role !== 'admin') {
          showToast('⚠️ Restore hanya dapat dilakukan Administrator!');
          event.target.value = '';
          return;
        }
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (!confirm('PERINGATAN: Restore akan mengganti seluruh isi database Cloud dengan isi file backup. Backup kondisi database sekarang akan diunduh terlebih dahulu. Lanjutkan?')) {
          event.target.value = '';
          return;
        }
        setIsRestoringBackup(true);
        try {
          const parsed = JSON.parse(await file.text());
          const restoreData = parsed && parsed.backupType === 'SIKUDES_CLOUD_FULL_BACKUP' ? parsed.database : parsed;
          if (!restoreData || typeof restoreData !== 'object' || Array.isArray(restoreData) ||
              !restoreData.transactions || !restoreData.accounts) {
            throw new Error('Format backup tidak dikenali atau data transaksi/rekening tidak tersedia.');
          }

          const { db, ref, get, set } = window.FirebaseDB;
          const currentSnapshot = await get(ref(db));
          if (currentSnapshot.exists()) {
            const safetyPackage = {
              backupType: 'SIKUDES_CLOUD_FULL_BACKUP',
              backupVersion: 1,
              createdAt: new Date().toISOString(),
              createdBy: currentUser.name,
              database: currentSnapshot.val()
            };
            const safetyBlob = new Blob([JSON.stringify(safetyPackage, null, 2)], { type: 'application/json' });
            const safetyUrl = URL.createObjectURL(safetyBlob);
            const safetyLink = document.createElement('a');
            safetyLink.href = safetyUrl;
            safetyLink.download = `Backup_Sebelum_Restore_${getLocalDateString()}.json`;
            document.body.appendChild(safetyLink);
            safetyLink.click();
            safetyLink.remove();
            setTimeout(() => URL.revokeObjectURL(safetyUrl), 1500);
          }

          await set(ref(db), restoreData);
          showToast('✅ Restore berhasil. Halaman akan dimuat ulang untuk menyegarkan data.');
          setTimeout(() => window.location.reload(), 1200);
        } catch (err) {
          console.error('Restore gagal:', err);
          showToast(`❌ Restore gagal: ${err.message || 'Format file/koneksi tidak valid.'}`);
        } finally {
          setIsRestoringBackup(false);
          event.target.value = '';
        }
      };

      const handleResetTransactions = async () => {
        if (!userPermissions.canReset) {
          showToast('⚠️ Akses Ditolak! Hanya Administrator yang dapat mereset database.');
          return;
        }

        const { db, ref, set } = window.FirebaseDB;
        setIsUploading(true);
        setUploadStep(1);
        setUploadStatusText('Menghapus seluruh data transaksi di Cloud...');
        setUploadProgressPct(30);

        try {
          await set(ref(db, 'transactions'), null);
          await set(ref(db, 'auditLogs'), null);

          setUploadStep(3);
          setUploadStatusText('Mereset saldo rekening ke Rp 0...');
          setUploadProgressPct(70);

          const resetAccs = accounts.map(acc => ({ ...acc, balance: 0 }));
          await set(ref(db, 'accounts'), resetAccs);

          setUploadStep(4);
          setUploadStatusText('Reset database berhasil!');

      const handleFileUpload = (e) => {
        if (!userPermissions.canImport) {
          showToast('⚠️ Akses Ditolak! Anda tidak memiliki izin untuk mengimport data.');
          return;
        }
        const file = e.target.files?.[0];
        if (!file) return;

        const { db, ref, set, push, update } = window.FirebaseDB;
        setIsUploading(true);
        setUploadStep(1);
        setUploadStatusText('Membaca dan memindai file CSV...');
        setUploadProgressPct(15);

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const text = evt.target?.result;
            if (!text) {
              showToast('⚠️ File kosong atau tidak dapat dibaca!');
              setIsUploading(false);
              return;
            }

            setUploadStep(2);
            setUploadStatusText('Menguraikan baris transaksi & teks...');
            setUploadProgressPct(35);

            const rows = [];
            let currentRow = [];
            let currentEntry = '';
            let insideQuote = false;

            for (let i = 0; i < text.length; i++) {
              const char = text[i];
              const nextChar = text[i + 1];

              if (char === '"') {
                if (insideQuote && nextChar === '"') {
                  currentEntry += '"';
                  i++;
                } else {
                  insideQuote = !insideQuote;
                }
              } else if ((char === ',' || char === ';') && !insideQuote) {
                currentRow.push(currentEntry.trim().replace(/^["']|["']$/g, ''));
                currentEntry = '';
              } else if ((char === '\r' || char === '\n') && !insideQuote) {
                if (char === '\r' && nextChar === '\n') { i++; }
                currentRow.push(currentEntry.trim().replace(/^["']|["']$/g, ''));
                if (currentRow.length > 1 || currentRow[0] !== '') {
                  rows.push(currentRow);
                }
                currentRow = [];
                currentEntry = '';
              } else {
                currentEntry += char;
              }
            }
            if (currentEntry !== '' || currentRow.length > 0) {
              currentRow.push(currentEntry.trim().replace(/^["']|["']$/g, ''));
              rows.push(currentRow);
            }

            if (rows.length < 2) {
              showToast('⚠️ Format baris file CSV tidak valid!');
              setIsUploading(false);
              return;
            }

            setUploadStep(3);
            setUploadStatusText('Memvalidasi nominal & mengelompokkan kegiatan...');
            setUploadProgressPct(65);

            let importedCount = 0;
            let totalRevenue = 0;
            let totalExpenditure = 0;
            
            const updates = {};
            const transactionsRef = ref(db, 'transactions');

            for (let i = 1; i < rows.length; i++) {
              const row = rows[i];
              if (!row || row.length < 5) continue;

              const dateVal = row[0] || new Date().toISOString().split('T')[0];
              const categoryVal = row[1] || 'Pendapatan Asli Desa (PAD)';
              const activityVal = row[2] || 'Umum';
              const ketVal = row[3] || 'Transaksi Import';

              const lastColVal = String(row[row.length - 1] || row[5] || '').trim().toUpperCase();
              
              let isIncome = true;
              if (lastColVal === 'OUT' || lastColVal.includes('KELUAR') || lastColVal.includes('KLR')) {
                isIncome = false;
              } else if (lastColVal === 'IN' || lastColVal.includes('MASUK') || lastColVal.includes('MSK')) {
                isIncome = true;
              } else {
                isIncome = !lastColVal.includes('OUT');
              }

              let amount = 0;
              const rawAmountStr = String(row[4] || row[3] || '').replace(/[^0-9]/g, '');
              amount = Number(rawAmountStr) || 0;

              if (amount <= 0) continue;

              const newTrxRef = push(transactionsRef);
              const newTrxId = `TRX-IMP-${Date.now().toString().slice(-4)}-${i}`;

              const formattedTrx = {
                id: newTrxId,
                date: dateVal,
                type: isIncome ? 'Pendapatan' : 'Pengeluaran',
                category: categoryVal,
                activity: activityVal,
                description: ketVal,
                accountId: '101',
                accountName: 'Kas Bendahara Desa',
                amount: amount,
                tax: 0,
                netAmount: amount,
                recipient: isIncome ? 'Kas Desa' : 'Pihak Terkait',
                status: 'Disetujui',
                approvedBy: currentUser ? currentUser.name : 'Sistem',
                approvedAt: new Date().toISOString().split('T')[0]
              };

              updates[`transactions/${newTrxRef.key}`] = formattedTrx;

              if (isIncome) totalRevenue += amount;
              else totalExpenditure += amount;

              importedCount++;
            }

            if (importedCount === 0) {
              showToast('⚠️ Tidak ada baris valid yang terbaca.');
              setIsUploading(false);
              return;
            }

            setUploadStep(4);
            setUploadStatusText('Menyimpan data massal ke Firebase Cloud Database...');
            setUploadProgressPct(85);

            await update(ref(db), updates);

            const updatedAccs = accounts.map(acc => {
              if (acc.id === '101') {
                const netChange = totalRevenue - totalExpenditure;
                return { ...acc, balance: (acc.balance || 0) + netChange };
              }
              return acc;
            });
            await set(ref(db, 'accounts'), updatedAccs);

            const auditRef = push(ref(db, 'auditLogs'));
            await set(auditRef, {
              timestamp: new Date().toLocaleString('id-ID'),
              user: currentUser ? currentUser.name : 'User',
              action: `Berhasil mengimport ${importedCount} data transaksi ke Cloud`,
              module: 'Import Data'
            });

            setUploadStep(5);
            setUploadStatusText('Selesai! Data berhasil disinkronkan.');
            setUploadProgressPct(100);

            setTimeout(() => {
              setIsUploading(false);
              showToast(`🎉 Sukses mengimport ${importedCount} data transaksi ke Cloud!`);
            }, 1200);

          } catch (err) {
            console.error('Error saat import:', err);
            setIsUploading(false);
            showToast('❌ Gagal mengimport data ke cloud.');
          }
        };

        reader.readAsText(file);
        e.target.value = '';
      };

        if (!file || !file.type || !file.type.startsWith('image/')) {
          reject(new Error('File harus berupa gambar/foto.'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Foto gagal dibaca.'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Foto tidak dapat diproses.'));
          img.onload = () => {
            const maxWidth = 300;
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const ctx = canvas.getContext('2d');
            if (!ctx) { reject(new Error('Pemrosesan foto tidak didukung browser.')); return; }
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);

                              const xc = (pts[i].x + pts[i + 1].x) / 2;

                              path += ` Q ${pts[i].x} ${pts[i].y}, ${xc} ${yc}`;
                            }
                            path += ` T ${pts[pts.length - 1].x} ${pts[pts.length - 1].y}`;
                            return path;
                          };

                          const pathRev = makeSmoothPath(pointsRev);
                          const pathExp = makeSmoothPath(pointsExp);

                          const pathRevArea = `${pathRev} L ${chartWidth + 15} ${chartHeight + 10} L 15 ${chartHeight + 10} Z`;
                          const pathExpArea = `${pathExp} L ${chartWidth + 15} ${chartHeight + 10} L 15 ${chartHeight + 10} Z`;

                          return (

                              <defs>
                                <linearGradient id="gradRev" x1="0%" y1="0%" x2="0%" y2="100%">

                                  <stop offset="100%" stopColor="#10b981" stopOpacity="0.0" />

                                  <stop offset="0%" stopColor="#f43f5e" stopOpacity="0.4" />
                                  <stop offset="100%" stopColor="#f43f5e" stopOpacity="0.0" />
                                </linearGradient>

                                      {val === 0 ? '0' : `${(val / 1000000)}Jt`}
                                    </text>
                                  </g>
                                );
                              })}

                              <path d={pathRevArea} fill="url(#gradRev)" />
                              <path d={pathExpArea} fill="url(#gradExp)" />

                              <path d={pathRev} fill="none" stroke="#10b981" strokeWidth="2.5" strokeLinecap="round" />
                              <path d={pathExp} fill="none" stroke="#f43f5e" strokeWidth="2.5" strokeLinecap="round" />

                                <g key={`rev-pt-${i}`}>
                                  <circle cx={pt.x} cy={pt.y} r="4" fill="#02050e" stroke="#10b981" strokeWidth="2" />
                                </g>

                                  <circle cx={pt.x} cy={pt.y} r="4" fill="#02050e" stroke="#f43f5e" strokeWidth="2" />

                      value={formData.description}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500"
                      required
                    />
                  </div>

                  <div className="rounded-2xl border border-dashed border-emerald-500/40 bg-emerald-950/20 p-3">
                    <label className="font-bold block mb-2 text-slate-200">Upload Bukti Transaksi (Opsional)</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={async (e) => {
                        const file = e.target.files && e.target.files[0];
                        if (!file) return;
                        try {
                          const compressedPhoto = await compressTransactionPhoto(file);
                          setFormData(prev => ({ ...prev, photo: compressedPhoto }));
                          showToast('✅ Foto berhasil dikompres dan siap disimpan.');
                        } catch (error) {
                          console.error(error);
                          showToast('❌ ' + (error.message || 'Foto gagal diproses.'));
                        }
                        e.target.value = '';
                      }}
                      className="block w-full text-xs text-slate-300 file:mr-3 file:rounded-lg file:border-0 file:bg-emerald-600 file:px-3 file:py-2 file:font-bold file:text-white"
                    />
                    <p className="text-[10px] text-slate-400 mt-1">Pilih foto bukti belanja (JPG, PNG, dan format gambar lain). Foto otomatis dikompres sebelum disimpan bersama data transaksi.</p>
                    {formData.photo ? (
                      <div className="mt-3 flex items-start gap-3">
                        <img src={formData.photo} alt="Pratinjau bukti transaksi" className="max-h-36 max-w-[150px] rounded-xl border border-white/20 object-contain bg-white" />
                        <button type="button" onClick={() => setFormData(prev => ({ ...prev, photo: '' }))} className="px-3 py-2 rounded-lg bg-rose-950/50 border border-rose-500/40 text-rose-300 font-bold">Hapus Foto</button>
                      </div>
                    ) : <p className="text-[10px] text-slate-500 mt-2">Belum ada foto bukti transaksi yang dipilih.</p>}
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Rekening Kas</label>
                      <select 
                        value={formData.accountId}
                        onChange={(e) => setFormData({ ...formData, accountId: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500"
                      >
                        {accounts.map(a => (<option key={a.id} value={a.id} className="bg-slate-900 text-slate-200">{a.name}</option>))}
                      </select>
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Nominal (Rp)</label>
                      <input 
                        type="number" 
                        placeholder="0" 
                        value={formData.amount}
                        onChange={(e) => setFormData({ ...formData, amount: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 font-bold shadow-inner focus:outline-none focus:border-emerald-500"
                        required
                      />
                    </div>
                  </div>

                  <div className="pt-3 flex gap-2 justify-end">
                    <button type="button" onClick={() => setIsModalTrxOpen(false)} className="px-4 py-2.5 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] transition">Batal</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600/90 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/45 transition">Simpan Perubahan</button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* MODAL MASTER DESA */}
          
          {/* MODAL KONFIRMASI HAPUS TRANSAKSI */}
          {deleteTargetTrx && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center p-4">
              <div className="bg-slate-950/90 rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-rose-500/40 space-y-4 text-slate-100">
                <div className="w-12 h-12 rounded-2xl bg-rose-950/60 border border-rose-500/40 flex items-center justify-center text-rose-400 mx-auto">
                  <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                </div>
                <div className="text-center space-y-1">
                  <h3 className="font-bold text-base text-slate-100">Konfirmasi Hapus Transaksi</h3>
                  <p className="text-xs text-slate-400">
                    Apakah Anda yakin ingin menghapus transaksi <b className="text-white">{deleteTargetTrx.category}</b> senilai <b className="text-rose-400">{formatIDR(deleteTargetTrx.amount)}</b> ini?
                  </p>
                </div>
                <div className="flex gap-2 pt-2">
                  <button 
                    type="button" 
                    onClick={() => setDeleteTargetTrx(null)} 
                    className="flex-1 py-2.5 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] transition text-xs"
                  >
                    Batal
                  </button>
                  <button 
                    type="button" 
                    onClick={executeDeleteTransaction} 
                    className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold shadow-lg shadow-rose-950 border border-rose-400/45 transition text-xs"
                  >
                    Ya, Hapus
                  </button>
                </div>
              </div>
            </div>
          )}

          {isModalMasterOpen && (
            <div className="fixed inset-0 z-50 bg-transparent flex items-center justify-center p-4 pointer-events-auto">
              <div className="bg-slate-950/90 rounded-3xl max-w-lg w-full p-6 shadow-[0_20px_50px_rgba(0,0,0,0.8)] border border-white/20 space-y-5 text-slate-100 backdrop-blur-none">
                
                <div className="flex justify-between items-center border-b border-white/15 pb-3">
                  <h3 className="font-bold text-base text-slate-100">Edit Data Master & Pejabat Desa</h3>
                  <button onClick={() => setIsModalMasterOpen(false)} className="text-slate-400 hover:text-white transition">
                    <i data-lucide="x-circle" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveMaster} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Nama Desa</label>
                    <input 
                      type="text" 
                      value={masterForm.name} 
                      onChange={e => setMasterForm({...masterForm, name: e.target.value})} 
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                      required 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Kecamatan</label>
                      <input 
                        type="text" 
                        value={masterForm.district} 
                        onChange={e => setMasterForm({...masterForm, district: e.target.value})} 
                        className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Kabupaten</label>
                      <input 
                        type="text" 
                        value={masterForm.regency} 
                        onChange={e => setMasterForm({...masterForm, regency: e.target.value})} 
                        className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                        required 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Kepala Desa</label>
                    <input 
                      type="text" 
                      value={masterForm.headOfVillage} 
                      onChange={e => setMasterForm({...masterForm, headOfVillage: e.target.value})} 
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                      required 
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Sekretaris Desa</label>
                    <input 
                      type="text" 
                      value={masterForm.secretary} 
                      onChange={e => setMasterForm({...masterForm, secretary: e.target.value})} 
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                      required 
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Kaur Keuangan</label>
                    <input 
                      type="text" 
                      value={masterForm.treasurer} 
                      onChange={e => setMasterForm({...masterForm, treasurer: e.target.value})} 
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                      required 
                    />
                  </div>

                  <div className="pt-3 flex gap-2 justify-end">
                    <button 
                      type="button" 
                      onClick={() => setIsModalMasterOpen(false)} 
                      className="px-4 py-2.5 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] transition"
                    >
                      Batal
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2.5 rounded-xl bg-emerald-600/90 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/45 transition"
                    >
                      Simpan Profil
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* MODAL ANGGARAN */}
          {isModalBudgetOpen && editingBudget && (
            <div className="fixed inset-0 z-50 bg-transparent flex items-center justify-center p-4 pointer-events-auto">
              <div className="bg-slate-950/90 rounded-3xl max-w-sm w-full p-6 shadow-[0_20px_50px_rgba(0,0,0,0.8)] border border-white/20 space-y-4 text-slate-100 backdrop-blur-none">
                
                <div className="flex justify-between items-center border-b border-white/15 pb-3">
                  <h3 className="font-bold text-base text-slate-100">Edit Pagu Anggaran</h3>
                  <button onClick={() => setIsModalBudgetOpen(false)} className="text-slate-400 hover:text-white transition">
                    <i data-lucide="x-circle" className="w-5 h-5"></i>
                  </button>
                </div>

                <p className="text-xs text-slate-400 font-medium">{editingBudget.name}</p>

                <form onSubmit={handleSaveBudget} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Pagu Anggaran (Rp)</label>
                    <input 
                      type="number" 
                      value={budgetForm.budget} 
                      onChange={e => setBudgetForm({ budget: e.target.value })} 
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 font-bold shadow-inner focus:outline-none focus:border-emerald-500" 
                      required 
                    />
                  </div>

                  <div className="pt-2 flex gap-2 justify-end">
                    <button 
                      type="button" 
                      onClick={() => setIsModalBudgetOpen(false)} 
                      className="px-3.5 py-2 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] transition"
                    >
                      Batal
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-2 rounded-xl bg-emerald-600/90 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/45 transition"
                    >
                      Simpan
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* MODAL REKENING */}
          {isModalAccountOpen && editingAccount && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center p-4">
              <div className="bg-slate-950/60 backdrop-blur-[50px] rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-white/25 space-y-4">
                <h3 className="font-bold text-base text-slate-100">Edit Akun Kas / Bank</h3>
                <form onSubmit={handleSaveAccount} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Nama Akun</label>
                    <input type="text" value={accountForm.name} onChange={e => setAccountForm({ ...accountForm, name: e.target.value })} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 backdrop-blur-3xl shadow-inner" required />
                  </div>
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Saldo Awal (Rp)</label>
                    <input type="number" value={accountForm.balance} onChange={e => setAccountForm({ ...accountForm, balance: e.target.value })} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 font-bold backdrop-blur-3xl shadow-inner" required />
                  </div>
                  <div className="pt-2 flex gap-2 justify-end">
                    <button type="button" onClick={() => setIsModalAccountOpen(false)} className="px-3.5 py-2 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] backdrop-blur-3xl">Batal</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-600/80 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/40 backdrop-blur-3xl">Simpan</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL UPLOAD ANIMASI */}
          {isUploading && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center p-4">
              <div className="bg-slate-950/60 backdrop-blur-[50px] rounded-3xl max-w-md w-full p-6 shadow-2xl border border-white/25 space-y-6 text-center">
                <div className="w-16 h-16 bg-emerald-950/80 text-emerald-400 rounded-full flex items-center justify-center mx-auto animate-pulse border border-emerald-400/40 shadow-inner">
                  <i data-lucide="refresh-cw" className="w-8 h-8 animate-spin"></i>
                </div>
                <div>
                  <h3 className="text-lg font-black text-slate-100">Sedang Mengimport Data</h3>
                  <p className="text-xs text-slate-400 mt-1">Sistem sedang memproses file dan mengirim data ke Cloud...</p>
                </div>
                <div className="space-y-2 text-left">
                  <div className="flex justify-between text-xs font-bold text-slate-300">
                    <span>{uploadStatusText}</span>
                    <span>{uploadProgressPct}%</span>
                  </div>
                  <div className="w-full bg-white/10 h-3 rounded-full overflow-hidden p-0.5 border border-white/20 backdrop-blur-3xl">
                    <div className="bg-emerald-500 h-full rounded-full transition-all duration-500 shadow-[0_0_12px_#10b981]" style={{ width: `${uploadProgressPct}%` }}></div>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
