    const formatIDR = (val) => {
      if (val === undefined || val === null || isNaN(val)) return 'Rp0';
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0

    // Menghasilkan tanggal lokal (bukan UTC) agar tanggal input tidak bergeser sehari.

      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const getTransactionDirection = (type) => {
      const value = String(type || '').trim().toLowerCase();
      if (value === 'in' || value.includes('pendapatan') || value.includes('penerimaan') || value.includes('masuk')) return 'in';
      if (value === 'out' || value.includes('pengeluaran') || value.includes('belanja') || value.includes('keluar')) return 'out';
      return 'unknown';
    };

    // Normalisasi kategori agar variasi kapitalisasi dan spasi tidak memecah rekap.
    // Alias dibuat terbatas pada singkatan APBDes yang jelas; nama kategori lain tetap terpisah.
    const normalizeCategoryKey = (value) => {
      const raw = String(value || '').normalize('NFC').trim().toLowerCase().replace(/\s+/g, ' ');
      const aliases = {
        'dd': 'dana desa (dd)',
        'dana desa': 'dana desa (dd)',
        'pad': 'pendapatan asli desa (pad)',
        'pendapatan asli desa': 'pendapatan asli desa (pad)',
        'add': 'alokasi dana desa (add)',
        'alokasi dana desa': 'alokasi dana desa (add)',
        'bhp': 'bagi hasil pajak (bhp)',
        'bagi hasil pajak daerah': 'bagi hasil pajak (bhp)',
        'pbb dan iuran rk': 'pajak ppb dan iuran rk',
        'pajak pbb dan iuran rk': 'pajak ppb dan iuran rk'
      };
      return aliases[raw] || raw;
    };

    const getSafeAmount = (value) => {
      if (typeof value === 'number') return Number.isFinite(value) ? Math.round(value) : 0;
      if (value === null || value === undefined || value === '') return 0;
      let raw = String(value).trim();
      if (!raw) return 0;
      const isNegative = /^\s*-/.test(raw) || /^\(.*\)$/.test(raw);
      raw = raw.replace(/[()]/g, '').replace(/[^0-9,.]/g, '');
      if (!raw) return 0;
      // Format Indonesia: titik pemisah ribuan, koma desimal. Format angka biasa tetap diterima.
      if (raw.includes(',')) {
        raw = raw.replace(/\./g, '').replace(',', '.');
      } else if ((raw.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(raw)) {
        raw = raw.replace(/\./g, '');
      }
      const parsed = Number(raw);
      if (!Number.isFinite(parsed)) return 0;
      return Math.round(isNegative ? -Math.abs(parsed) : parsed);
    };

    const getTransactionYear = (value) => {
      const date = String(value || '').trim();
      const isoMatch = date.match(/^(\d{4})-\d{1,2}-\d{1,2}$/);
      const slashMatch = date.match(/^\d{1,2}\/\d{1,2}\/(\d{4})$/);
      return isoMatch ? isoMatch[1] : (slashMatch ? slashMatch[1] : '');
    };

    const isReportEligibleTransaction = (t, year) => {
      if (getTransactionYear(t.date) !== String(year)) return false;
      const status = String(t.status || '').trim().toLowerCase();
      // Status kosong tetap diterima untuk kompatibilitas data lama.
      // Status yang terisi harus merupakan status persetujuan yang dikenal.
      if (status && !['disetujui', 'approved', 'approve', 'setuju', 'sudah disetujui'].includes(status)) return false;
      return getTransactionDirection(t.type) !== 'unknown' && getSafeAmount(t.amount) > 0;
    };

    const parseDateToNumber = (dateStr) => {
      if (!dateStr) return 0;
      if (dateStr.includes('-')) {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          return parseInt(`${parts[0]}${parts[1].padStart(2, '0')}${parts[2].padStart(2, '0')}`, 10);
        }
      } else if (dateStr.includes('/')) {
        const parts = dateStr.split('/');
        if (parts.length === 3) {
          return parseInt(`${parts[2]}${parts[1].padStart(2, '0')}${parts[0].padStart(2, '0')}`, 10);
        }
      }
      return 0;
    };

    const sortTransactionsChronologically = (trxList) => {
      return [...trxList].sort((a, b) => {
        const numA = parseDateToNumber(a.date);
        const numB = parseDateToNumber(b.date);
        if (numA !== numB) return numA - numB;
        if (a.type === 'Pendapatan' && b.type !== 'Pendapatan') return -1;
        if (a.type !== 'Pendapatan' && b.type === 'Pendapatan') return 1;
        return 0;
      });
    };

        if (!userPermissions.canImport) {
          showToast('⚠️ Akses Ditolak! Anda tidak memiliki izin untuk mengimport data.');
          return;
        }
        const file = e.target.files?.[0];
        if (!file) return;

        const { db, ref, set, push, update } = window.FirebaseDB;
        setIsUploading(true);
        setUploadStep(1);
        setUploadStatusText('Membaca dan memindai file CSV...');
        setUploadProgressPct(15);

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const text = evt.target?.result;
            if (!text) {
              showToast('⚠️ File kosong atau tidak dapat dibaca!');
              setIsUploading(false);
              return;
            }

            setUploadStep(2);
            setUploadStatusText('Menguraikan baris transaksi & teks...');
            setUploadProgressPct(35);

            const rows = [];
            let currentRow = [];
            let currentEntry = '';
            let insideQuote = false;

            for (let i = 0; i < text.length; i++) {
              const char = text[i];
              const nextChar = text[i + 1];

              if (char === '"') {
                if (insideQuote && nextChar === '"') {
                  currentEntry += '"';
                  i++;
                } else {
                  insideQuote = !insideQuote;
                }
              } else if ((char === ',' || char === ';') && !insideQuote) {
                currentRow.push(currentEntry.trim().replace(/^["']|["']$/g, ''));
                currentEntry = '';
              } else if ((char === '\r' || char === '\n') && !insideQuote) {
                if (char === '\r' && nextChar === '\n') { i++; }
                currentRow.push(currentEntry.trim().replace(/^["']|["']$/g, ''));
                if (currentRow.length > 1 || currentRow[0] !== '') {
                  rows.push(currentRow);
                }
                currentRow = [];
                currentEntry = '';
              } else {
                currentEntry += char;
              }
            }
            if (currentEntry !== '' || currentRow.length > 0) {
              currentRow.push(currentEntry.trim().replace(/^["']|["']$/g, ''));
              rows.push(currentRow);
            }

            if (rows.length < 2) {
              showToast('⚠️ Format baris file CSV tidak valid!');
              setIsUploading(false);
              return;
            }

            setUploadStep(3);
            setUploadStatusText('Memvalidasi nominal & mengelompokkan kegiatan...');
            setUploadProgressPct(65);

            let importedCount = 0;
            let totalRevenue = 0;
            let totalExpenditure = 0;
            
            const updates = {};
            const transactionsRef = ref(db, 'transactions');

            for (let i = 1; i < rows.length; i++) {
              const row = rows[i];
              if (!row || row.length < 5) continue;

              const dateVal = row[0] || new Date().toISOString().split('T')[0];
              const categoryVal = row[1] || 'Pendapatan Asli Desa (PAD)';
              const activityVal = row[2] || 'Umum';
              const ketVal = row[3] || 'Transaksi Import';

              const lastColVal = String(row[row.length - 1] || row[5] || '').trim().toUpperCase();
              
              let isIncome = true;
              if (lastColVal === 'OUT' || lastColVal.includes('KELUAR') || lastColVal.includes('KLR')) {
                isIncome = false;
              } else if (lastColVal === 'IN' || lastColVal.includes('MASUK') || lastColVal.includes('MSK')) {
                isIncome = true;
              } else {
                isIncome = !lastColVal.includes('OUT');
              }

              let amount = 0;
              const rawAmountStr = String(row[4] || row[3] || '').replace(/[^0-9]/g, '');
              amount = Number(rawAmountStr) || 0;

              if (amount <= 0) continue;

              const newTrxRef = push(transactionsRef);
              const newTrxId = `TRX-IMP-${Date.now().toString().slice(-4)}-${i}`;

              const formattedTrx = {
                id: newTrxId,
                date: dateVal,
                type: isIncome ? 'Pendapatan' : 'Pengeluaran',
                category: categoryVal,
                activity: activityVal,
                description: ketVal,
                accountId: '101',
                accountName: 'Kas Bendahara Desa',
                amount: amount,
                tax: 0,
                netAmount: amount,
                recipient: isIncome ? 'Kas Desa' : 'Pihak Terkait',
                status: 'Disetujui',
                approvedBy: currentUser ? currentUser.name : 'Sistem',
                approvedAt: new Date().toISOString().split('T')[0]
              };

              updates[`transactions/${newTrxRef.key}`] = formattedTrx;

              if (isIncome) totalRevenue += amount;
              else totalExpenditure += amount;

              importedCount++;
            }

            if (importedCount === 0) {
              showToast('⚠️ Tidak ada baris valid yang terbaca.');
              setIsUploading(false);
              return;
            }

            setUploadStep(4);
            setUploadStatusText('Menyimpan data massal ke Firebase Cloud Database...');
            setUploadProgressPct(85);

            await update(ref(db), updates);

            const updatedAccs = accounts.map(acc => {
              if (acc.id === '101') {
                const netChange = totalRevenue - totalExpenditure;
                return { ...acc, balance: (acc.balance || 0) + netChange };
              }
              return acc;
            });
            await set(ref(db, 'accounts'), updatedAccs);

            const auditRef = push(ref(db, 'auditLogs'));
            await set(auditRef, {
              timestamp: new Date().toLocaleString('id-ID'),
              user: currentUser ? currentUser.name : 'User',
              action: `Berhasil mengimport ${importedCount} data transaksi ke Cloud`,
              module: 'Import Data'
            });

            setUploadStep(5);
            setUploadStatusText('Selesai! Data berhasil disinkronkan.');
            setUploadProgressPct(100);

            setTimeout(() => {
              setIsUploading(false);
              showToast(`🎉 Sukses mengimport ${importedCount} data transaksi ke Cloud!`);

          } catch (err) {

                          const data = monthlyChartData;
                          
                          const maxVal = Math.max(...data.map(d => Math.max(d.revenue, d.expense)), 140000000);
                          const chartHeight = 200;
                          const chartWidth = 600;
                          const stepX = chartWidth / (months.length - 1);

                          const pointsRev = data.map((d, i) => ({
                            x: i * stepX + 15,
                            y: chartHeight - (d.revenue / maxVal) * chartHeight + 10
                          }));

                          const pointsExp = data.map((d, i) => ({
                            x: i * stepX + 15,
                            y: chartHeight - (d.expense / maxVal) * chartHeight + 10
                          }));

                          const makeSmoothPath = (pts) => {
                            if (pts.length === 0) return '';
                            let path = `M ${pts[0].x} ${pts[0].y}`;
                            for (let i = 0; i < pts.length - 1; i++) {
                              const xc = (pts[i].x + pts[i + 1].x) / 2;
                              const yc = (pts[i].y + pts[i + 1].y) / 2;
                              path += ` Q ${pts[i].x} ${pts[i].y}, ${xc} ${yc}`;
                            }
                            path += ` T ${pts[pts.length - 1].x} ${pts[pts.length - 1].y}`;
                            return path;
                          };

                          const pathRev = makeSmoothPath(pointsRev);
                          const pathExp = makeSmoothPath(pointsExp);

                          const pathRevArea = `${pathRev} L ${chartWidth + 15} ${chartHeight + 10} L 15 ${chartHeight + 10} Z`;
                          const pathExpArea = `${pathExp} L ${chartWidth + 15} ${chartHeight + 10} L 15 ${chartHeight + 10} Z`;

                          const yTicks = [0, 40000000, 80000000, 120000000];

                          return (
                            <svg viewBox={`0 0 ${chartWidth + 70} ${chartHeight + 45}`} className="w-full h-full overflow-visible">
                              <defs>
                                <linearGradient id="gradRev" x1="0%" y1="0%" x2="0%" y2="100%">
                                  <stop offset="0%" stopColor="#10b981" stopOpacity="0.4" />
                                  <stop offset="100%" stopColor="#10b981" stopOpacity="0.0" />
                                </linearGradient>
                                <linearGradient id="gradExp" x1="0%" y1="0%" x2="0%" y2="100%">
                                  <stop offset="0%" stopColor="#f43f5e" stopOpacity="0.4" />
                                  <stop offset="100%" stopColor="#f43f5e" stopOpacity="0.0" />
                                </linearGradient>
                              </defs>

                              {yTicks.map((val, idx) => {
                                const y = chartHeight - (val / maxVal) * chartHeight + 10;
                                return (
                                  <g key={idx}>
                                    <line x1="15" y1={y} x2={chartWidth + 15} y2={y} stroke="rgba(255,255,255,0.08)" strokeDasharray="3 3" strokeWidth="1" />
                                    <text x={chartWidth + 22} y={y + 3} fill="#94a3b8" fontSize="9" fontWeight="600">
                                      {val === 0 ? '0' : `${(val / 1000000)}Jt`}
                                    </text>
                                  </g>
                                );
                              })}

                              <path d={pathRevArea} fill="url(#gradRev)" />
                              <path d={pathExpArea} fill="url(#gradExp)" />

                              <path d={pathRev} fill="none" stroke="#10b981" strokeWidth="2.5" strokeLinecap="round" />
                              <path d={pathExp} fill="none" stroke="#f43f5e" strokeWidth="2.5" strokeLinecap="round" />

                              {pointsRev.map((pt, i) => (
                                <g key={`rev-pt-${i}`}>
                                  <circle cx={pt.x} cy={pt.y} r="4" fill="#02050e" stroke="#10b981" strokeWidth="2" />
                                </g>
                              ))}

                              {pointsExp.map((pt, i) => (
                                <g key={`exp-pt-${i}`}>
                                  <circle cx={pt.x} cy={pt.y} r="4" fill="#02050e" stroke="#f43f5e" strokeWidth="2" />
                                </g>
                              ))}

                              {months.map((m, i) => {
                                const x = i * stepX + 15;
                                return (

                                  </text>

                          <th className="p-3">Pengguna</th>
                          <th className="p-3">Modul</th>
                          <th className="p-3">Aktivitas</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/10">
                        {auditLogs.length === 0 ? (
                          <tr>
                            <td colSpan={4} className="p-6 text-center text-slate-400 italic">Belum ada riwayat audit log tercatat</td>
                          </tr>
                        ) : (
                          auditLogs
                            .slice((auditPage - 1) * itemsPerPage, auditPage * itemsPerPage)
                            .map((log, idx) => (
                              <tr key={log.idKey || idx} className="hover:bg-white/[0.05] transition">
                                <td className="p-3 font-mono text-slate-400">{log.timestamp}</td>
                                <td className="p-3 font-bold text-emerald-400">{log.user}</td>
                                <td className="p-3"><span className="bg-white/[0.06] backdrop-blur-3xl px-2 py-0.5 rounded text-[10px] text-slate-300 border border-white/15">{log.module}</span></td>
                                <td className="p-3 font-medium text-slate-200">{log.action}</td>
                              </tr>
                            ))
                        )}
                      </tbody>
                    </table>
                  </div>

                  {Math.ceil(auditLogs.length / itemsPerPage) > 1 && (
                    <div className="flex justify-between items-center pt-2 text-xs">
                      <span className="text-slate-400">
                        Halaman {auditPage} dari {Math.ceil(auditLogs.length / itemsPerPage)}
                      </span>
                      <div className="flex gap-2">
                        <button
                          onClick={() => setAuditPage(prev => Math.max(prev - 1, 1))}
                          disabled={auditPage === 1}
                          className="px-3 py-1.5 rounded-lg bg-white/[0.04] border border-white/15 text-slate-200 disabled:opacity-40 font-semibold"
                        >
                          Sebelumnya
                        </button>
                        <button
                          onClick={() => setAuditPage(prev => Math.min(prev + 1, Math.ceil(auditLogs.length / itemsPerPage)))}
                          disabled={auditPage === Math.ceil(auditLogs.length / itemsPerPage)}
                          className="px-3 py-1.5 rounded-lg bg-white/[0.04] border border-white/15 text-slate-200 disabled:opacity-40 font-semibold"
                        >
                          Berikutnya
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

            </main>
          </div>

          {/* MODAL TRANSAKSI */}
          {/* MODAL TRANSAKSI */}
          {isModalTrxOpen && (
            <div className="fixed inset-0 z-50 bg-transparent flex items-center justify-center p-4 pointer-events-auto">
              <div className="bg-slate-950/90 rounded-3xl max-w-lg w-full p-6 shadow-[0_20px_50px_rgba(0,0,0,0.8)] border border-white/20 space-y-5 text-slate-100 backdrop-blur-none">
                
                <div className="flex justify-between items-center border-b border-white/15 pb-3">
                  <h3 className="font-bold text-base text-slate-100">{editingTrx ? 'Edit Transaksi' : `Pencatatan Transaksi ${trxType}`} (Cloud)</h3>
                  <button onClick={() => setIsModalTrxOpen(false)} className="text-slate-400 hover:text-white transition">
                    <i data-lucide="x-circle" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveTransaction} className="space-y-4 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Tanggal Transaksi</label>
                    <input type="date" value={formData.date || getLocalDateString()} onChange={(e) => setFormData({ ...formData, date: e.target.value })} className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" required />
                  </div>
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Kategori APBDes</label>
                    <select 
                      value={formData.category}
                      onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 font-medium shadow-inner focus:outline-none focus:border-emerald-500"
                      required
                    >
                      <option value="" className="bg-slate-900 text-slate-200">-- Pilih Kategori --</option>
                      {budgetItems.filter(b => trxType === 'Pendapatan' ? b.category === 'Pendapatan' : b.category === 'Belanja').map(b => (
                        <option key={b.id} value={b.name} className="bg-slate-900 text-slate-200">{b.code} - {b.name}</option>
                      ))}
                      <option value="Lainnya" className="bg-slate-900 text-slate-200">➕ Lainnya (Input Kategori Baru...)</option>
                    </select>
                    {formData.category === 'Lainnya' && (
                      <input
                        type="text"
                        placeholder="Masukkan nama Kategori baru..."
                        value={formData.customCategory}
                        onChange={(e) => setFormData({ ...formData, customCategory: e.target.value })}
                        className="w-full mt-2 p-2.5 rounded-xl border border-emerald-500/50 bg-slate-900 text-slate-100 font-medium shadow-inner"
                        required
                      />
                    )}
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="font-bold text-slate-300">Kegiatan Terkait (Opsional)</label>
                      {formData.activity && formData.activity !== '-' && formData.activity !== 'Lainnya' && (
                        <span className="text-[11px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded-md font-bold border border-emerald-500/30">
                          Saldo Kegiatan: {formatIDR(getActivityBalance(formData.activity))}
                        </span>
                      )}
                    </div>
                    <select
                      value={formData.activity}
                      onChange={(e) => {
                        const val = e.target.value;
                        setFormData({ 
                          ...formData, 
                          activity: val, 
                          customActivity: val === 'Lainnya' ? formData.customActivity : '' 
                        });
                      }}
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 font-medium shadow-inner focus:outline-none focus:border-emerald-500"
                    >
                      <option value="" className="bg-slate-900 text-slate-200">-- Tanpa Kegiatan Khusus / Umum --</option>
                      {availableActivities.map((act, idx) => (
                        <option key={idx} value={act} className="bg-slate-900 text-slate-200">{act} (Saldo: {formatIDR(getActivityBalance(act))})</option>
                      ))}
                      <option value="Lainnya" className="bg-slate-900 text-slate-200">➕ Tambah Jenis Kegiatan Baru...</option>
                    </select>

                    {formData.activity === 'Lainnya' && (
                      <div className="mt-2 space-y-1">
                        <input
                          type="text"
                          placeholder="Ketik nama kegiatan baru..."
                          value={formData.customActivity}
                          onChange={(e) => setFormData({ ...formData, customActivity: e.target.value })}
                          className="w-full p-2.5 rounded-xl border border-emerald-500/50 bg-slate-900 text-slate-100 font-medium shadow-inner"
                          autoFocus
                          required
                        />
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Uraian Transaksi</label>
                    <input 
                      type="text" 
                      placeholder="Contoh: Pembayaran Honor..." 
                      value={formData.description}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Rekening Kas</label>
                      <select 
                        value={formData.accountId}
                        onChange={(e) => setFormData({ ...formData, accountId: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500"
                      >
                        {accounts.map(a => (<option key={a.id} value={a.id} className="bg-slate-900 text-slate-200">{a.name}</option>))}
                      </select>
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Nominal (Rp)</label>
                      <input 
                        type="number" 
                        placeholder="0" 
                        value={formData.amount}
                        onChange={(e) => setFormData({ ...formData, amount: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 font-bold shadow-inner focus:outline-none focus:border-emerald-500"
                        required
                      />
                    </div>
                  </div>

                  <div className="pt-3 flex gap-2 justify-end">
                    <button type="button" onClick={() => setIsModalTrxOpen(false)} className="px-4 py-2.5 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] transition">Batal</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600/90 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/45 transition">Simpan Perubahan</button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* MODAL MASTER DESA */}
          
          {/* MODAL KONFIRMASI HAPUS TRANSAKSI */}
          {deleteTargetTrx && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center p-4">
              <div className="bg-slate-950/90 rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-rose-500/40 space-y-4 text-slate-100">
                <div className="w-12 h-12 rounded-2xl bg-rose-950/60 border border-rose-500/40 flex items-center justify-center text-rose-400 mx-auto">
                  <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                </div>
                <div className="text-center space-y-1">
                  <h3 className="font-bold text-base text-slate-100">Konfirmasi Hapus Transaksi</h3>
                  <p className="text-xs text-slate-400">
                    Apakah Anda yakin ingin menghapus transaksi <b className="text-white">{deleteTargetTrx.category}</b> senilai <b className="text-rose-400">{formatIDR(deleteTargetTrx.amount)}</b> ini?
                  </p>
                </div>
                <div className="flex gap-2 pt-2">
                  <button 
                    type="button" 
                    onClick={() => setDeleteTargetTrx(null)} 
                    className="flex-1 py-2.5 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] transition text-xs"
                  >
                    Batal
                  </button>
                  <button 
                    type="button" 
                    onClick={executeDeleteTransaction} 
                    className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold shadow-lg shadow-rose-950 border border-rose-400/45 transition text-xs"
                  >
                    Ya, Hapus
                  </button>
                </div>
              </div>
            </div>
          )}

          {isModalMasterOpen && (
            <div className="fixed inset-0 z-50 bg-transparent flex items-center justify-center p-4 pointer-events-auto">
              <div className="bg-slate-950/90 rounded-3xl max-w-lg w-full p-6 shadow-[0_20px_50px_rgba(0,0,0,0.8)] border border-white/20 space-y-5 text-slate-100 backdrop-blur-none">
                
                <div className="flex justify-between items-center border-b border-white/15 pb-3">
                  <h3 className="font-bold text-base text-slate-100">Edit Data Master & Pejabat Desa</h3>
                  <button onClick={() => setIsModalMasterOpen(false)} className="text-slate-400 hover:text-white transition">
                    <i data-lucide="x-circle" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveMaster} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Nama Desa</label>
                    <input 
                      type="text" 
                      value={masterForm.name} 
                      onChange={e => setMasterForm({...masterForm, name: e.target.value})} 
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                      required 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Kecamatan</label>
                      <input 
                        type="text" 
                        value={masterForm.district} 
                        onChange={e => setMasterForm({...masterForm, district: e.target.value})} 
                        className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-slate-300">Kabupaten</label>
                      <input 
                        type="text" 
                        value={masterForm.regency} 
                        onChange={e => setMasterForm({...masterForm, regency: e.target.value})} 
                        className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                        required 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Kepala Desa</label>
                    <input 
                      type="text" 
                      value={masterForm.headOfVillage} 
                      onChange={e => setMasterForm({...masterForm, headOfVillage: e.target.value})} 
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                      required 
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Sekretaris Desa</label>
                    <input 
                      type="text" 
                      value={masterForm.secretary} 
                      onChange={e => setMasterForm({...masterForm, secretary: e.target.value})} 
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                      required 
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Kaur Keuangan</label>
                    <input 
                      type="text" 
                      value={masterForm.treasurer} 
                      onChange={e => setMasterForm({...masterForm, treasurer: e.target.value})} 
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 shadow-inner focus:outline-none focus:border-emerald-500" 
                      required 
                    />
                  </div>

                  <div className="pt-3 flex gap-2 justify-end">
                    <button 
                      type="button" 
                      onClick={() => setIsModalMasterOpen(false)} 
                      className="px-4 py-2.5 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] transition"
                    >
                      Batal
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2.5 rounded-xl bg-emerald-600/90 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/45 transition"
                    >
                      Simpan Profil
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* MODAL ANGGARAN */}
          {isModalBudgetOpen && editingBudget && (
            <div className="fixed inset-0 z-50 bg-transparent flex items-center justify-center p-4 pointer-events-auto">
              <div className="bg-slate-950/90 rounded-3xl max-w-sm w-full p-6 shadow-[0_20px_50px_rgba(0,0,0,0.8)] border border-white/20 space-y-4 text-slate-100 backdrop-blur-none">
                
                <div className="flex justify-between items-center border-b border-white/15 pb-3">
                  <h3 className="font-bold text-base text-slate-100">Edit Pagu Anggaran</h3>
                  <button onClick={() => setIsModalBudgetOpen(false)} className="text-slate-400 hover:text-white transition">
                    <i data-lucide="x-circle" className="w-5 h-5"></i>
                  </button>
                </div>

                <p className="text-xs text-slate-400 font-medium">{editingBudget.name}</p>

                <form onSubmit={handleSaveBudget} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Pagu Anggaran (Rp)</label>
                    <input 
                      type="number" 
                      value={budgetForm.budget} 
                      onChange={e => setBudgetForm({ budget: e.target.value })} 
                      className="w-full p-2.5 rounded-xl border border-white/20 bg-slate-900 text-slate-100 font-bold shadow-inner focus:outline-none focus:border-emerald-500" 
                      required 
                    />
                  </div>

                  <div className="pt-2 flex gap-2 justify-end">
                    <button 
                      type="button" 
                      onClick={() => setIsModalBudgetOpen(false)} 
                      className="px-3.5 py-2 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] transition"
                    >
                      Batal
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-2 rounded-xl bg-emerald-600/90 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/45 transition"
                    >
                      Simpan
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* MODAL REKENING */}
          {isModalAccountOpen && editingAccount && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center p-4">
              <div className="bg-slate-950/60 backdrop-blur-[50px] rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-white/25 space-y-4">
                <h3 className="font-bold text-base text-slate-100">Edit Akun Kas / Bank</h3>
                <form onSubmit={handleSaveAccount} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Nama Akun</label>
                    <input type="text" value={accountForm.name} onChange={e => setAccountForm({ ...accountForm, name: e.target.value })} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 backdrop-blur-3xl shadow-inner" required />
                  </div>
                  <div>
                    <label className="font-bold block mb-1 text-slate-300">Saldo Awal (Rp)</label>
                    <input type="number" value={accountForm.balance} onChange={e => setAccountForm({ ...accountForm, balance: e.target.value })} className="w-full p-2.5 rounded-xl border border-white/20 bg-white/[0.04] text-slate-100 font-bold backdrop-blur-3xl shadow-inner" required />
                  </div>
                  <div className="pt-2 flex gap-2 justify-end">
                    <button type="button" onClick={() => setIsModalAccountOpen(false)} className="px-3.5 py-2 rounded-xl border border-white/20 font-bold text-slate-300 hover:bg-white/[0.05] backdrop-blur-3xl">Batal</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-600/80 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-950 border border-emerald-400/40 backdrop-blur-3xl">Simpan</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL UPLOAD ANIMASI */}
          {isUploading && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center p-4">
              <div className="bg-slate-950/60 backdrop-blur-[50px] rounded-3xl max-w-md w-full p-6 shadow-2xl border border-white/25 space-y-6 text-center">
                <div className="w-16 h-16 bg-emerald-950/80 text-emerald-400 rounded-full flex items-center justify-center mx-auto animate-pulse border border-emerald-400/40 shadow-inner">
                  <i data-lucide="refresh-cw" className="w-8 h-8 animate-spin"></i>
                </div>
                <div>
                  <h3 className="text-lg font-black text-slate-100">Sedang Mengimport Data</h3>
                  <p className="text-xs text-slate-400 mt-1">Sistem sedang memproses file dan mengirim data ke Cloud...</p>
                </div>
                <div className="space-y-2 text-left">
                  <div className="flex justify-between text-xs font-bold text-slate-300">
                    <span>{uploadStatusText}</span>
                    <span>{uploadProgressPct}%</span>
                  </div>
                  <div className="w-full bg-white/10 h-3 rounded-full overflow-hidden p-0.5 border border-white/20 backdrop-blur-3xl">
                    <div className="bg-emerald-500 h-full rounded-full transition-all duration-500 shadow-[0_0_12px_#10b981]" style={{ width: `${uploadProgressPct}%` }}></div>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
